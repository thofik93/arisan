/* Bot ragu lalu bertanya balik ("Maksudnya Bu X curiga sama Bu Y?"). Jawaban singkat pemain mengonfirmasi atau membalik tebakan. */
function confirmReply(text){
  const pc=chat.pendingClarify;if(!pc||pc.day!==G.day)return null;
  const s=normText(text),ws=s.trim().split(' ').filter(w=>!/^[,.!?]$/.test(w));
  if(findMentions(s.trim().split(' ')).some(m=>m.id!==pc.target)||ws.length>6)return null;
  if(pc.guess!=='mention'&&/^\s*(iya|iyaa|ya|yap|yup|yes|betul|bener|benar|he eh|heeh|tepat|nah itu|itu dia|oke|ok|iyes)\b/.test(s))return{type:pc.guess,target:pc.target,conf:.95,confirmed:true};
  if(/^\s*(bukan|gak|salah|no)\b/.test(s)&&ws.length<=4){const f={accuse:'defend',defend:'accuse'}[pc.guess];return f?{type:f,target:pc.target,conf:.9,confirmed:true}:{type:'chat',conf:.3,confirmed:true};}
  return null;
}
function genClarify(sp,m){
  const M=addr(sp,human()),self=m.gt===sp.id,T=self?'aku':addr(sp,pl(m.gt));
  const L={accuse:self?[`Maksudnya ${M} curiga sama aku?`,`${M} nuduh aku, gitu?`]:[`Maksudnya ${M} curiga sama ${T}?`,`Jadi ${M} nuduh ${T}, gitu?`,`${M} curiga ${T}, ya?`],
    defend:self?[`${M} belain aku, ya?`,`Maksudnya ${M} percaya sama aku?`]:[`Maksudnya ${M} belain ${T}?`,`Jadi ${M} percaya sama ${T}?`],
    mention:self?[`Aku kenapa, ${M}?`,`Ada apa sama aku, ${M}?`]:[`${cap(T)} kenapa, ${M}? Curiga atau gimana?`,`Maksudnya gimana soal ${T}, ${M}?`]};
  return finish(sp,pickR(L[m.guess]||L.mention),'neutral');
}
function sendHuman(raw){
  const me=human();
  const text=String(raw||'').replace(/[<>]/g,'').trim().slice(0,160);
  if(!text||chat.sent>=MAX_SEND)return;
  // jawaban atas pertanyaan konfirmasi: tidak memakai jatah pesan, dan jadi data latih yang paling tepercaya
  const pc=chat.pendingClarify,cr=confirmReply(text);
  chat.pendingClarify=null;
  const aw=chat.awaitAnswer;chat.awaitAnswer=null;
  let hm=cr||parseHuman(text);
  // jawaban atas pertanyaan bot: alibi tanpa nama tetap dibaca sebagai penjelasan untuk si penanya
  const sN=normText(text),ak=(aw&&aw.kind==='alibi')||/\b(aku|semalam)\b/.test(sN)?alibiOf(sN):null;
  if(!cr&&ak&&['chat','mention','question','report'].includes(hm.type)&&!findMentions(sN.trim().split(' ')).length)hm={type:'deny',target:aw?aw.from:(chatContext().atMe||{}).from??null,conf:.8};
  if(cr&&pc&&G.rec&&G.rec.human[pc.recIdx]&&cr.type!=='chat'){G.rec.human[pc.recIdx].x=cr.type;G.rec.human[pc.recIdx].xt=pc.target;}
  // menagih ucapan yang bertentangan
  let co=null;
  if(G.flags&&G.flags.callout&&!cr){
    const me0=human();
    if(ak&&(hm.type==='deny'||hm.type==='swear'||aw)){
      const prev=G.hAlibi[G.day];
      const seenBy=G.msgs.find(m=>m.type==='report'&&m.value&&m.target===me0.id&&m.from!==me0.id&&pl(m.from).alive);
      if(prev&&prev.cls!==ak.cls){co={kind:'alibi',prev:prev.text,now:ak.text};me0.alibi=me0.alibi||{};me0.alibi[G.day]=[prev.text,ak.text];me0.alibiSaid=me0.alibiSaid||{};me0.alibiSaid[G.day]=2;}
      else if(seenBy&&ak.cls==='home')co={kind:'seen',by:seenBy.from};
      if(!prev)G.hAlibi[G.day]=ak;
    }
    if(!co&&(hm.type==='accuse'||hm.type==='defend')&&hm.target!=null&&!hm.retract&&(hm.conf??1)>=.6){
      const prev=G.hStance[hm.target];
      if(prev&&prev.dir!==hm.type)co={kind:hm.type==='defend'?'flipDef':'flipAcc',x:hm.target};
    }
    if((hm.type==='accuse'||hm.type==='defend')&&hm.target!=null&&(hm.conf??1)>=.6)G.hStance[hm.target]={dir:hm.type,day:G.day};
  }
  // ragu dan ada orang yang disebut: tanya balik dulu, jangan langsung mengubah keyakinan siapa pun
  const unsure=!cr&&(hm.conf??1)<.6&&hm.target!=null&&pl(hm.target).alive&&!pl(hm.target).human&&(chat.clarified||0)<2&&['accuse','defend','mention'].includes(hm.type)&&G.mode==='bot';
  const m={from:me.id,text,type:'chat',target:hm.target};hm.from=me.id;hm.text=text;
  if(['accuse','defend','claimBend','claimGosip','report'].includes(hm.type)){m.type=hm.type;m.value=hm.value;if(hm.why)m.why=hm.why;}
  else if(hm.type==='swear'||hm.type==='deny'){m.type='swear';}
  else if(hm.type==='claimRole'&&hm.role==='bendahara'){m.type='claimRole';}
  else if(hm.type==='ask'){m.target=hm.target??hm.addressee;}
  if(unsure){m.type='chat';m.value=undefined;m.why=undefined;}
  chat.waitDefense=0;
  if(G.rec&&G.rec.human.length<60){
    const lab=cr?'confirm':hm.type==='ask'?'ask_'+hm.ask:hm.type;
    // petunjuk untuk belajar tanpa koreksi: keyakinan aturan, waktu kirim, dan 3 pesan bot terakhir sebagai konteks
    const cx=G.msgs.filter(x=>x.from!=null&&x.from!==me.id&&!pl(x.from).human).slice(-3).map(x=>[x.from,x.type,x.target??null,x.value==null?null:!!x.value]);
    const rl=chat.lastBotAt?Math.min(600,Math.round((Date.now()-chat.lastBotAt)/1000)):null;
    G.rec.human.push({d:G.day,n:anonNorm(text),l:lab,t:hm.target??null,a:hm.addressee??null,g:hm.learned||null,c:Math.round((hm.conf??.85)*100)/100,ts:Math.round((Date.now()-G.rec.start)/1000),rl,cx});
  }
  applyMsg(m);addHeat(m);
  // sikap tambahan dalam kalimat yang sama ("Bu A bukan bandar, Bu B yang bandar")
  for(const e of unsure?[]:hm.extra||[])if(e.target!=null&&pl(e.target).alive)applyMsg({from:me.id,type:e.type,target:e.target,noFollow:true});
  G.humanStats.statements++;
  const hid='h'+(G.msgCounter=(G.msgCounter||0)+1);
  addToFeed(msgHTML(m,hid));sfx.send();if(!cr)chat.sent++;
  if(REACTS[m.type])setTimeout(()=>addReacts(hid,m.type),1400);
  // siapa yang menanggapi, sesuai maksud pesan
  const R=[];
  const add=(id,as)=>{if(id!=null&&id!==me.id&&pl(id).alive&&!pl(id).human&&!R.some(r=>r.id===id))R.push({id,as});};
  const nextOther=()=>{const c=shuffle(alive().filter(p=>!p.human&&!R.some(r=>r.id===p.id))).sort((a,b)=>PERS[b.bot].talk-PERS[a.bot].talk);return c.length?c[0].id:null;};
  if(co){
    // yang menagih: yang melihat sendiri, atau ibu yang paling curiga pada pemain
    const by=co.by!=null&&pl(co.by).alive?co.by:alive().filter(p=>!p.human).sort((a,b)=>(b.role==='bandar'?.6:prob(b,me.id))-(a.role==='bandar'?.6:prob(a,me.id)))[0]?.id;
    add(by,'callout');
  }
  if(aw&&pl(aw.from).alive&&!unsure)add(aw.from,'probeFollow');
  if(unsure){
    // yang ditanya balik: orangnya sendiri kalau dia bot, atau ibu yang paling kepo
    const t=pl(hm.target),asker=!t.human&&t.alive?t.id:nextOther();
    add(asker,'clarify');
    chat.pendingClarify={guess:hm.type==='mention'?'mention':hm.type,target:hm.target,day:G.day,recIdx:G.rec?G.rec.human.length-1:-1};
    chat.clarified=(chat.clarified||0)+1;
  }else if(hm.type==='ask'){
    if(hm.ask==='callRole'){
      const bd=alive().find(p=>p.role==='bendahara'&&!p.human);if(bd&&rnd()<.6)add(bd.id,'role');
      const fake=alive().find(p=>p.role==='bandar'&&!p.human&&p.strategy==='palsu');if(fake&&rnd()<.4)add(fake.id,'role');
      add(nextOther(),'other');
    }else{
      add(hm.addressee,'addr');
      if(hm.ask==='about'||hm.ask==='alibi'||hm.addressee==null)add(nextOther(),'other');
      if(hm.ask==='opinion'&&hm.addressee==null)add(nextOther(),'other');
    }
  }else if(hm.type==='deny'||hm.type==='swear'){
    add(hm.target,'accuser');if(rnd()<.5||hm.target==null)add(nextOther(),'other');
  }else if(hm.type==='greet'){add(nextOther(),'other');if(rnd()<.5)add(nextOther(),'other');}
  else if(hm.type==='laugh'){if(rnd()<.6)add(nextOther(),'other');}
  else if(hm.type==='thanks'){add(hm.target,'target');}
  else{
    add(hm.target,'target');
    if(hm.x!=null&&hm.agreeWith!=null)add(hm.x,'source');
    const extra=hm.type==='question'?2:hm.type==='chat'||hm.type==='mention'?(rnd()<.6?1:0):1;
    for(let i=0;i<extra;i++)add(nextOther(),'other');
    if(hm.type==='angry'&&hm.target==null)add(nextOther(),'other');
  }
  // yang dituduh sudah menjawab lewat balasan ini, jangan membela diri dua kali
  if(R.some(r=>r.as==='target'))m.answered=true;
  chat.queue.splice(chat.idx,0,...R.map(r=>({reply:r.id,hm:{...hm,as:r.as,co}})));
  if(chat.done){chat.done=false;setTimeout(()=>tick(G.token),700);}
  document.getElementById('msgIn').value='';chat.act=null;
  document.querySelectorAll('#acts button').forEach(x=>x.classList.remove('on'));
  document.getElementById('tgts').hidden=true;
  const left=MAX_SEND-chat.sent,info=document.getElementById('sendInfo');
  document.getElementById('send').textContent=`Kirim · ${Math.max(0,left)}`;
  if(hm.type==='chat'&&(P.tipChat||0)<2){P.tipChat=(P.tipChat||0)+1;saveP();info.textContent='Tip: sebut nama orangnya supaya ibu-ibu paham, misalnya "aku curiga sama Bu Ratna".';info.hidden=false;}
  else info.hidden=true;
  if(left<=0){info.textContent='Jatah pesanmu hari ini habis. Simak yang lain, lalu lanjut ke sidang.';info.hidden=false;document.getElementById('send').disabled=true;document.getElementById('msgIn').disabled=true;}
}

/* ---------- voting (mode bot) ---------- */
function startVote(only,revote){
  if(screen!=='day'&&screen!=='tie')return;
  applyTells();
  screen='vote';G.token++;
  const me=human();
  const pool=only?only.map(pl):alive();
  const cands=pool;
  let sel=null;
  const votes=[];
  for(const p of alive())if(!p.human){const v=botVote(p,pool);if(v!=null)votes.push([p.id,v]);}
  const canVote=me.alive&&pool.some(q=>q.id!==me.id);
  const shown=new Map();
  const draw=()=>{
    const total=[...shown.values()].reduce((a,b)=>a+b.length,0);
    // diri sendiri tidak ditampilkan, kecuali ternyata ada yang memilihmu
    app.querySelector('#poll').innerHTML=cands.filter(p=>p.id!==me.id||(shown.get(p.id)||[]).length).map(p=>{
      const vs=shown.get(p.id)||[];
      return `<button class="opt ${sel===p.id?'sel':''}" data-id="${p.id}" ${shown.size||p.id===me.id||!canVote?'disabled':''}>${av(p,36,true)}<span><b>${esc(p.name)}</b>${p.id===me.id?' (kamu)':''}</span><span class="count">${shown.size?vs.length:''}</span>
        ${shown.size?`<span class="vbar"><i style="width:${total?vs.length/Math.max(1,votes.length)*100:0}%"></i></span>`:''}${vs.length?`<span class="voters">${vs.map(v=>av(pl(v),18)).join('')}</span>`:''}</button>`;
    }).join('');
  };
  render(`
  <div class="top"><div class="grow"><h2>${revote?'Voting ulang':'Voting pertemuan '+G.day}</h2><span class="sub">${revote?'Hanya antara yang seri':'Siapa yang dikeluarkan dari grup?'}</span></div>${MENU_BTN}</div>
  <div class="scroll"><div class="vlast" id="vlast" hidden></div>
    <div class="poll" id="poll"></div>${canVote?'<button class="linkish" id="abstain">Tidak memilih</button>':''}<div class="vlog" id="vlog" aria-live="polite"></div></div>
  <div class="bottom">${canVote?'<button class="primary" id="go" disabled>Pilih satu orang</button>':'<button class="primary" id="go">Buka suara</button>'}</div>`);
  if(canVote)coach('vote','Pilih yang paling kamu curigai. Suara terbanyak keluar dari grup.');
  draw();
  app.onclick=e=>{
    if(screen!=='vote')return;
    const b=e.target.closest('.opt[data-id]');
    if(b&&!b.disabled){sel=+b.dataset.id;sfx.pop();draw();const g=document.getElementById('go');g.disabled=false;g.textContent='Kunci suara: '+pl(sel).name;return;}
    const id=e.target.closest('button')&&e.target.closest('button').id;
    if(id!=='go'&&id!=='abstain')return;
    if(id==='go'&&canVote&&sel==null)return;
    app.onclick=null;
    if(canVote&&id==='go'){votes.push([me.id,sel]);G.humanStats.votes++;if(isBandar(sel))G.humanStats.votedBandar++;}
    const ab=document.getElementById('abstain');if(ab)ab.remove();
    app.querySelector('.bottom').innerHTML='<button class="ghost" id="skipVotes">Tampilkan semua</button>';
    // suara dibuka satu per satu, dengan komentar
    const order=shuffle(votes);let i=0;const tok=G.token;
    const step=()=>{
      if(G.token!==tok||screen!=='vote')return;
      if(i>=order.length)return finish();
      const [v,t]=order[i++];
      if(!shown.size)cands.forEach(c=>shown.set(c.id,[]));
      (shown.get(t)||shown.set(t,[]).get(t)).push(v);
      draw();sfx.pop();
      const voter=pl(v),comment=voter.human?'':' "'+compose(voter,'voteComment',{})+'"';
      const line=`${av(voter,22)}<span><b>${esc(voter.name)}</b> memilih <b>${esc(pl(t).name)}</b>${esc(comment)}</span>`;
      const vl=document.getElementById('vlast');vl.innerHTML=line;vl.hidden=false;
      document.getElementById('vlog').insertAdjacentHTML('beforeend',`<div class="vline">${line}</div>`);
      timer=setTimeout(step,{santai:1100,normal:700,cepat:250}[chatSpeed]);
    };
    let timer=null;
    const finish=()=>{
      if(G.token!==tok)return;
      clearTimeout(timer);
      shown.clear();cands.forEach(c=>shown.set(c.id,[]));for(const [v,t] of votes)(shown.get(t)||shown.set(t,[]).get(t)).push(v);draw();
      sfx.shake();
      const bottom=app.querySelector('.bottom');bottom.innerHTML='<button class="primary" id="next">Lanjut</button>';
      bottom.querySelector('#next').onclick=()=>afterVote(votes,revote);
    };
    on('#skipVotes','click',()=>{i=order.length;finish();});
    if(!order.length)return finish();
    step();
  };
}
function afterVote(votes,revote){
  const t=tally(votes);
  if(t.kicked==null&&!revote&&t.top.length>=2&&t.max>0)return tieScreen(t.top,votes);
  for(const [v,x] of votes){pl(x).votesGot++;if(x!==t.kicked)bump(x,v,1);}
  G.votes.push({day:G.day,votes,kicked:t.kicked});
  const me=human();
  if(t.kicked!=null){
    const k=pl(t.kicked);applyKick(k.id,votes);
    if(k.role!=='bandar'&&me&&votes.some(([v,x])=>v===me.id&&x===k.id)){P.wrongKicks=(P.wrongKicks||0)+1;saveP();}
  }
  const over=checkWin(true);
  kickScreen(t,over);
}

function kickScreen(t,over){

    <div class="bottom">${nextBtn}</div>`);bind();return;
  }
  const bandar=k.role==='bandar';
  const words=k.human&&G.mode!=='pass'?'Kalian bakal nyesel!':compose(k,bandar?(rnd()<.55?'lastBandar':'lastBluff'):'lastInnocent',{});
  // 1. kata-kata terakhir, 2. ketegangan, 3. peran dibuka + reaksi

  <div class="scroll" style="justify-content:center" id="kickBody">

  </div>

  sfx.shake();

    if(shown||G.token!==tok)return;shown=true;

    document.getElementById('suspense').outerHTML=`<div class="rolecard ${bandar?'bandar':''}" style="align-items:center;text-align:center">
        ${av({...k,alive:true},72)}<span class="rname">${bandar?'Bandar Bodong!':'Ternyata '+ROLE[k.role].name}</span>

      ${reactors.map(r=>msgHTML({from:r.id,text:compose(r,bandar?'reactBandar':'reactInnocent',{})})).join('')}`;
    document.getElementById('kickBottom').innerHTML=nextBtn;bind();
  };

}

/* ---------- akhir permainan ---------- */
function endScreen(){
  screen='end';
  if(G.mode==='bot')shareGame('end');
  const me=human();
  const pass=G.mode==='pass';
  let html='',share='';
  const roleRows=G.players.map(p=>`<div>${av({...p,alive:true},32)}<span>${esc(p.name)}${p.human&&!pass?' (kamu)':''}${p.alive?'':' <span class="small muted">· keluar hari '+p.kickedDay+'</span>'}</span><span class="r ${p.role}">${ROLE[p.role].name}</span></div>`).join('');
  if(pass){
    G.winner==='warga'?sfx.win():sfx.lose();
    const first=!P.ach.bareng;P.ach.bareng=true;P.xp+=10;saveP();
    html=`<div class="endbanner ${G.winner==='warga'?'win':'lose'}"><span class="big">${G.winner==='warga'?'Warga menang!':'Bandar menang!'}</span><span>${esc(G.reason)}</span></div>
      ${first?'<div class="result good">Prestasi baru: Main Bareng</div>':''}
      <div class="card"><h3>Peran semua orang</h3><div class="rolelist">${roleRows}</div></div>`;
    share=`${BRAND} · main bareng ${G.n} orang\n${G.winner==='warga'?'Warga menang, pelakunya ketahuan':'Pelakunya kabur bawa kas'} di pertemuan ${G.day}\n${shareLink()}`;
  }else{
    const team=ROLE[me.role].team,won=G.winner===team;
    won?sfx.win():sfx.lose();
    // hadiah
    let xp=10+(won?20:0)+5*G.humanStats.votedBandar+(me.alive?5:0),kue=won?6:2;
    const dk=todayKey(),firstDaily=G.daily&&!P.daily.done[dk];
    if(firstDaily){
      xp+=10;
      const y=todayKey(new Date(Date.now()-864e5));
      P.daily.streak=P.daily.last===y?P.daily.streak+1:1;P.daily.last=dk;
      P.daily.done[dk]={win:won,role:me.role,day:G.day};
    }
    const r0=rankIdx(P.xp);P.xp+=xp;P.kue+=kue;const r1=rankIdx(P.xp);
    P.stats.games++;if(won)P.stats.wins++;
    const rs=P.stats.role[me.role]||{g:0,w:0};rs.g++;if(won)rs.w++;P.stats.role[me.role]=rs;
    // prestasi
    const newAch=[];
    const give=id=>{if(!P.ach[id]){P.ach[id]=true;newAch.push(ACH.find(a=>a.id===id).name);}};
    if(won&&team==='warga'&&G.kicked.length&&isBandar(G.kicked[0])&&pl(G.kicked[0]).kickedDay===1)give('detektif');
    if(won&&me.role==='bandar'&&me.votesGot===0)give('licin');
    if(G.auditedBandarByHuman)give('audit');
    if(me.framed>0&&me.alive)give('fitnah');
    if(G.humanStats.statements>=8)give('ember');
    if(P.daily.streak>=3)give('rutin');
    if((P.wrongKicks||0)>=3)give('salah');
    if(r1>=4)give('sesepuh');
    saveP();
    const ri_=rankIdx(P.xp),next=RANKS[ri_+1];
    html=`<div class="endbanner ${won?'win':'lose'}"><span class="big">${won?'Kamu menang!':'Kamu kalah'}</span><span>${esc(G.reason)}</span><span class="small">Peranmu: ${ROLE[me.role].name}</span></div>
      ${r1>r0?`<div class="result good">Naik pangkat jadi <b>${esc(RANKS[r1][1])}</b>!</div>`:''}
      ${newAch.map(a=>`<div class="result good">Prestasi baru: <b>${esc(a)}</b></div>`).join('')}
      <div class="reward"><div><b>+${xp}</b><span class="small">XP</span></div><div><b class="kue">+${kue}</b><span class="small">kue</span></div>${G.daily?`<div><b>${P.daily.streak||0}</b><span class="small">hari berturut</span></div>`:`<div><b>${P.kue}</b><span class="small">total kue</span></div>`}</div>
      <div class="card kocok" id="kocok"><h3>Kocokan arisan</h3>${kocokSponsorHTML()}<p class="small muted">Siapa yang dapat arisan hari ini? Peluangmu ${Math.round(kocokChance(G.n)*100)}%.</p><div class="slot" id="slot">?</div><button class="primary" id="kocokBtn">Kocok!</button>
      <details class="small" style="width:100%"><summary>Bagaimana peluangnya dihitung?</summary><p>Peluangmu sama dengan 1 dibagi jumlah pemain, ditambah ${Math.round(KOCOK_BASE_BONUS*100)}% untuk setiap kocokan yang belum kamu menangkan, maksimal ${Math.round(KOCOK_MAX*100)}%. Hadiahnya ${KOCOK_PRIZE} kue. Kue hanya didapat dari bermain dan tidak bisa dibeli.</p></details></div>
      <div class="card"><h3>Peran semua orang</h3><div class="rolelist">${roleRows}</div></div>
      <p class="small muted">${next?`${next[0]-P.xp} XP lagi menuju ${esc(next[1])}.`:'Kamu sudah di pangkat tertinggi.'}</p>`;
    const grid=G.votes.map(v=>v.kicked==null?'⬜':isBandar(v.kicked)?'🟩':'🟥').join('');
    share=`${BRAND}${G.daily?` Harian #${dailyNo()}`:''}\nPeranku: ${ROLE[me.role].name}\n${won?'Menang':'Kalah'} di pertemuan ${G.day} ${grid}\nMain juga: ${shareLink()}`;
  }
  render(`
  <div class="top"><div class="grow"><h2>Arisan selesai</h2><span class="sub">${G.daily?'Arisan Harian #'+dailyNo():pass?'Main bareng':'Lawan bot'}</span></div></div>
  <div class="scroll">${html}</div>
  <div class="bottom stack"><button class="primary" id="again">Main lagi</button><button id="shareBtn">Bagikan hasil</button><button class="ghost" id="home">Beranda</button></div>`);
  on('#home','click',homeScreen);
  on('#again','click',()=>pass?passSetup():G.daily?startBotGame({n:6,daily:true}):startBotGame({n:G.n}));
  on('#shareBtn','click',async()=>{
    try{
      const C=window.Capacitor;
      if(navigator.share){await navigator.share({text:share});return;}
      await navigator.clipboard.writeText(share);toast('Hasil disalin. Tempel di grup WA-mu!');
    }catch(e){openSheet(`<h3>Salin hasilmu</h3><p class="share" style="user-select:all">${esc(share)}</p><button class="primary">Tutup</button>`,()=>closeSheet());}
  });
  on('#kocokBtn','click',e=>{
    e.target.disabled=true;sfx.shake();
    const chance=kocokChance(G.n),won=Math.random()<chance;
    const names=G.players.map(p=>p.name),slot=document.getElementById('slot');
    const winner=won?me.name:pickR(G.players.filter(p=>p.id!==me.id&&p.role!=='bandar')).name;
    let i=0;const iv=setInterval(()=>{slot.textContent=names[i++%names.length];},90);
    setTimeout(()=>{
      clearInterval(iv);slot.textContent=winner;
      if(won){slot.classList.add('won');P.kue+=KOCOK_PRIZE;P.kocokDry=0;if(!P.ach.kocok){P.ach.kocok=true;toast('Prestasi baru: Ratu Kocokan');}sfx.win();buzz();
        e.target.outerHTML=`<p><b>Kamu dapat arisan! +${KOCOK_PRIZE} kue</b></p>`;}
      else{P.kocokDry=(P.kocokDry||0)+1;e.target.outerHTML=`<p class="small muted">Belum rezeki. Peluangmu di kocokan berikutnya naik jadi ${Math.round(kocokChance(G.n)*100)}%.</p>`;}
      saveP();
    },1800);
  });
}

function kocokSponsorHTML(){
  const x=sponsorFor('kocokan');if(!x)return '';
  const k=x.slots.kocokan;
  return `<div class="sp-box"><p class="small">${esc(String(k.text||('Kocokan dipersembahkan oleh '+x.brand)).slice(0,120))} ${sponsorChip(x.brand)}</p>
    ${k.prize?`<p class="small"><b>Promo:</b> ${esc(String(k.prize).slice(0,80))}</p>`:''}${sponsorLink(x)}</div>`;
}
/* ---------- mode oper HP ---------- */
function passSetup(){
  screen='passSetup';
  let names=store.get('passNames',['','','','','']);
  const draw=()=>{render(`
  <div class="top"><button class="ghost small" id="back">Kembali</button><div class="grow"><h2>Main bareng</h2><span class="sub">Satu HP dioper bergantian</span></div></div>
  <div class="scroll">
    <p class="muted">Duduk melingkar. HP dioper saat lihat peran, aksi malam, dan voting. Diskusinya ngobrol langsung.</p>
    <div class="card"><h3>Pemain (${names.length})</h3>
      ${names.map((n,i)=>`<div class="row">${av({...BOTS[i%8],alive:true},34)}<input type="text" data-i="${i}" value="${esc(n)}" maxlength="12" placeholder="Pemain ${i+1}" aria-label="Nama pemain ${i+1}">${names.length>4?`<button class="small ghost" data-del="${i}" aria-label="Hapus">✕</button>`:''}</div>`).join('')}
      ${names.length<8?'<button class="small" id="add">+ Tambah pemain</button>':''}
      <p class="small muted">Peran: ${roleSummary(names.length)}.</p>
    </div>
    <details><summary>Cara main</summary>${howTo()}</details>
  </div>
  <div class="bottom"><button class="primary" id="go">Mulai</button></div>`);
  app.querySelectorAll('input[data-i]').forEach(el=>el.addEventListener('input',()=>{names[+el.dataset.i]=el.value;}));};
  draw();
  app.onclick=e=>{
    if(screen!=='passSetup')return;
    const b=e.target.closest('button');if(!b)return;
    if(b.dataset.del!=null){names.splice(+b.dataset.del,1);draw();return;}
    if(b.id==='add'){names.push('');draw();return;}
    if(b.id==='back'){app.onclick=null;homeScreen();return;}
    if(b.id==='go'){
      names=names.map((n,i)=>(n||'').replace(/[<>]/g,'').trim().slice(0,12)||'Pemain '+(i+1));
      if(new Set(names).size!==names.length){toast('Nama pemain tidak boleh sama.');return;}
      store.set('passNames',names);app.onclick=null;
      newGame({mode:'pass',n:names.length,names});
      passQueue(G.players.map(p=>p.id),passReveal,()=>{passNight();});
    }
  };
}
/* Oper HP satu per satu: layar serah-terima, lalu layar pribadi */
function passQueue(ids,privateFn,done){
  let i=0;
  const nextP=()=>{
    if(i>=ids.length)return done();
    const p=pl(ids[i++]);
    screen='handoff';
    render(`<div class="handoff">${av({...p,alive:true},84)}<span class="muted">Oper HP ke</span><span class="big">${esc(p.name)}</span>
      <p class="small muted">Yang lain jangan ngintip ya.</p><button class="primary" id="me">Aku ${esc(p.name)}</button></div>`);
    on('#me','click',()=>{sfx.pop();privateFn(p,nextP);});
  };
  nextP();
}
function passReveal(p,next){
  const r=ROLE[p.role];
  const partner=p.role==='bandar'?G.players.filter(q=>q.role==='bandar'&&q.id!==p.id):[];
  render(`<div class="scroll" style="justify-content:center">
    <div class="rolecard ${p.role}"><span class="small" style="font-weight:800">${esc(p.name)}, kamu adalah</span><span class="rname">${r.name}</span><p>${r.desc}</p>
    ${partner.length?`<p><b>Rekanmu:</b> ${partner.map(q=>esc(q.name)).join(', ')}</p>`:''}<p class="small"><span class="sandal-ic">${sandalSVG(p.sandalHex,18)}</span>Sandalmu warna <b>${esc(p.sandal)}</b>.</p></div></div>
    <div class="bottom"><button class="primary" id="ok">Sudah hafal, sembunyikan</button></div>`);
  on('#ok','click',next);
}
function passNight(){
  G.phase='night';G.night={actions:{},results:{}};
  passQueue(alive().map(p=>p.id),(p,next)=>{
    const r=ROLE[p.role];let sel=null;
    const targets=alive().filter(q=>q.id!==p.id&&!(p.role==='bandar'&&q.role==='bandar'));
    const draw=()=>{render(`
      <div class="top"><div class="grow"><h2>Malam ke-${G.day} · ${esc(p.name)}</h2><span class="sub">${r.name}</span></div></div>
      <div class="scroll"><h2>${r.act}</h2>
      <div class="people">${targets.map(q=>`<button class="person ${sel===q.id?'sel':''}" data-id="${q.id}">${av(q,44,true)}<span>${esc(q.name)}</span></button>`).join('')}</div></div>
      <div class="bottom">${p.role==='bandar'?'<button class="ghost" id="skip">Tidak mengajak siapa pun</button>':''}<button class="primary" id="go" ${sel==null?'disabled':''}>Kunci pilihan</button></div>`);};
    draw();
    app.onclick=e=>{
      const b=e.target.closest('[data-id]');if(b){sel=+b.dataset.id;draw();return;}
      const id=e.target.closest('button')&&e.target.closest('button').id;
      if(id==='go'&&sel!=null){app.onclick=null;G.night.actions[p.id]=sel;passNightNote(p,next);}
      if(id==='skip'){app.onclick=null;passNightNote(p,next);}
    };
  },()=>{
    resolveNight();
    // hasil pribadi dibagikan lewat oper HP sekali lagi agar urutan tidak membocorkan peran
    passQueue(alive().map(p=>p.id),(p,next)=>{
      const r=G.night.results[p.id];
      let txt='Malammu tenang. Tidak ada kabar khusus.';
      if(r)txt=resultText(r);
      render(`<div class="scroll" style="justify-content:center"><div class="result">${txt}</div></div><div class="bottom"><button class="primary" id="ok">Sembunyikan</button></div>`);
      on('#ok','click',next);
    },passMorning);
  });
}
function passNightNote(p,next){
  render(`<div class="scroll" style="justify-content:center"><div class="result">Pilihanmu tercatat. Hasilnya diberikan setelah semua orang selesai.</div></div><div class="bottom"><button class="primary" id="ok">Sembunyikan</button></div>`);
  on('#ok','click',next);
}
function passMorning(){
  screen='passDay';
  if(checkWin(false))return endScreen();
  let secs=180,iv=null;
  const last=G.day>=TUNE.maxDay;
  render(`
  <div class="top"><div class="grow"><h2>Pagi, pertemuan ${G.day}/${TUNE.maxDay}</h2><span class="sub">Kas ${jt(G.kas)}</span></div></div>
  <div class="scroll">
    <div class="kasbar"><i style="width:${G.kas/KAS_START*100}%"></i></div>
    ${G.news.map(newsHTML).join('')}
    ${last?'<div class="sys alert">Pertemuan terakhir! Kalau bandar tidak ketahuan hari ini, dia kabur.</div>':''}
    <div class="card"><h3>Masih di grup</h3><div class="people">${alive().map(p=>`<div class="person" style="cursor:default">${av(p,40,true)}<span>${esc(p.name)}</span></div>`).join('')}</div></div>
    <div class="card" style="align-items:center"><span class="small muted">Waktu diskusi</span><div class="timer" id="timer">3:00</div>
      <div class="row"><button class="small" id="plus">+1 menit</button><button class="small" id="pause">Jeda</button></div></div>
  </div>
  <div class="bottom"><button class="primary" id="vote">Mulai voting rahasia</button></div>`);
  const tEl=document.getElementById('timer');
  const show=()=>{tEl.textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');};
  let running=true;
  iv=setInterval(()=>{if(screen!=='passDay'){clearInterval(iv);return;}if(!running)return;secs=Math.max(0,secs-1);show();if(secs===0){sfx.shake();buzz();running=false;}},1000);
  on('#plus','click',()=>{secs+=60;show();});
  on('#pause','click',e=>{running=!running;e.target.textContent=running?'Jeda':'Lanjut';});
  on('#vote','click',()=>{clearInterval(iv);passVote();});
}
function passVote(){
  const votes=[];
  passQueue(alive().map(p=>p.id),(p,next)=>{
    let sel=null;
    const draw=()=>{render(`
      <div class="top"><div class="grow"><h2>Suara rahasia · ${esc(p.name)}</h2></div></div>
      <div class="scroll"><div class="people">${alive().filter(q=>q.id!==p.id).map(q=>`<button class="person ${sel===q.id?'sel':''}" data-id="${q.id}">${av(q,44,true)}<span>${esc(q.name)}</span></button>`).join('')}</div></div>
      <div class="bottom"><button class="ghost" id="abs">Tidak memilih</button><button class="primary" id="go" ${sel==null?'disabled':''}>Kunci suara</button></div>`);};
    draw();
    app.onclick=e=>{
      const b=e.target.closest('[data-id]');if(b){sel=+b.dataset.id;draw();return;}
      const id=e.target.closest('button')&&e.target.closest('button').id;
      if(id==='go'&&sel!=null){app.onclick=null;votes.push([p.id,sel]);next();}
      if(id==='abs'){app.onclick=null;next();}
    };
  },()=>{
    screen='passTally';
    const t=tally(votes);
    render(`
    <div class="top"><div class="grow"><h2>Hasil voting</h2><span class="sub">Kumpul lagi, lihat bareng-bareng</span></div></div>
    <div class="scroll"><div class="poll">${alive().map(p=>{const c=t.count[p.id]||0;return `<div class="opt">${av(p,34,true)}<span><b>${esc(p.name)}</b></span><span class="count">${c}</span><span class="vbar"><i style="width:${votes.length?c/votes.length*100:0}%"></i></span></div>`;}).join('')}</div>
    <p class="small muted">Suara tetap rahasia, yang ditampilkan hanya jumlahnya.</p></div>
    <div class="bottom"><button class="primary" id="go">Buka hasilnya</button></div>`);
    on('#go','click',()=>{
      for(const [,x] of votes)pl(x).votesGot++;
      if(t.kicked!=null)applyKick(t.kicked,votes);
      for(const [v,x] of votes)if(x!==t.kicked)bump(x,v,1);
      G.votes.push({day:G.day,votes,kicked:t.kicked});
      kickScreen(t,checkWin(true));
    });
  });
}

/* ---------- lemari & prestasi ---------- */
function lemari(tab){
  screen='lemari';
  const tabs=[['hijab','Kerudung'],['frame','Bingkai'],['title','Gelar'],['sticker','Stiker']];
  const items=COSMETICS.filter(c=>c.slot===tab);
  render(`
  <div class="top"><button class="ghost small" id="back">Kembali</button><div class="grow"><h2>Lemari</h2></div><span class="pill"><span class="kue">●</span> ${P.kue} kue</span></div>
  <div class="scroll">
    <div class="row" style="justify-content:center">${av({...humanLook(),alive:true},72)}</div>
    <div class="chips">${tabs.map(([k,l])=>`<button data-tab="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}</div>
    ${items.map(c=>{const key=c.slot+':'+c.id,own=P.owned.includes(key),onNow=P[c.slot]===c.id;
      const prev=c.color?`<span class="swatch" style="background:${c.color}"></span>`:`<span class="swatch" style="background:var(--maroon-deep)"></span>`;
      const priceTxt=c.sponsor&&!c.price?'Ambil gratis':`${c.price} kue`;
      const btn=c.slot==='sticker'?(own?'<span class="small" style="color:var(--pandan);font-weight:800">Dimiliki</span>':`<button class="small" data-buy="${key}" ${P.kue<c.price?'disabled':''}>${priceTxt}</button>`)
        :onNow?'<span class="small" style="color:var(--pandan);font-weight:800">Dipakai</span>':own?`<button class="small" data-wear="${key}">Pakai</button>`:`<button class="small" data-buy="${key}" ${P.kue<c.price?'disabled':''}>${priceTxt}</button>`;
      return `<div class="item">${prev}<span><b>${esc(c.name)}</b>${c.text&&c.slot==='sticker'?`<br><span class="small muted">${esc(c.text)}</span>`:''}${c.sponsor?`<br>${sponsorChip(c.sponsor)} ${sponsorLink(c)}`:''}</span>${btn}</div>`;}).join('')}
    <p class="small muted">Kue didapat dari bermain dan menang kocokan. Semua barang hanya tampilan dan tidak mengubah peluang menang.</p>
  </div>`);
  app.onclick=e=>{
    if(screen!=='lemari')return;
    const b=e.target.closest('button');if(!b)return;
    if(b.id==='back'){app.onclick=null;return homeScreen();}
    if(b.dataset.tab)return lemari(b.dataset.tab);
    if(b.dataset.buy){const [s,id]=b.dataset.buy.split(':'),c=cos(s,id);if(P.kue<c.price)return;P.kue-=c.price;P.owned.push(b.dataset.buy);if(s!=='sticker')P[s]=id;saveP();sfx.win();return lemari(tab);}
    if(b.dataset.wear){const [s,id]=b.dataset.wear.split(':');P[s]=id;saveP();return lemari(tab);}
  };
}
function achScreen(){
  screen='ach';
  const st=P.stats;
  const roleStats=Object.entries(st.role).map(([r,v])=>`<span class="pill">${ROLE[r].short} ${v.w}/${v.g}</span>`).join(' ');
  render(`
  <div class="top"><button class="ghost small" id="back">Kembali</button><div class="grow"><h2>Prestasi</h2></div></div>
  <div class="scroll">
    <div class="card"><h3>Statistik</h3><p>${st.games} permainan · ${st.wins} menang${st.games?` (${Math.round(st.wins/st.games*100)}%)`:''}</p><div class="row wrap">${roleStats||'<span class="small muted">Belum ada.</span>'}</div></div>
    ${ACH.map(a=>`<div class="ach ${P.ach[a.id]?'':'locked'}"><span class="ico">${P.ach[a.id]?'★':'?'}</span><span><b>${esc(a.name)}</b><br><span class="small muted">${esc(a.desc)}</span></span></div>`).join('')}
  </div>`);
  on('#back','click',homeScreen);
}

/* ---------- native ---------- */
(function native(){
  const C=window.Capacitor;
  if(!(C&&C.isNativePlatform&&C.isNativePlatform()))return;
  try{C.Plugins.StatusBar&&C.Plugins.StatusBar.setStyle({style:'DARK'});C.Plugins.StatusBar&&C.Plugins.StatusBar.setBackgroundColor({color:'#350c19'});}catch(e){}
  const App=C.Plugins.App;if(!App)return;
  App.addListener('backButton',()=>{
    if(document.getElementById('sheet'))return closeSheet();
    if(screen==='home')return App.exitApp();
    if(['lemari','ach','botSetup','passSetup'].includes(screen))return homeScreen();
    openGameMenu();
  });
})();

loadSponsors();
loadBrain();
flushOutbox();
homeScreen();
addEventListener('hashchange',()=>{loadSponsors().then(()=>{if(screen==='home')homeScreen();});});
})();
