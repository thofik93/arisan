<style>
/* Layout: aplikasi satu layar setinggi HP. Header tetap di atas, isi bergulir, aksi utama menempel di bawah dalam jangkauan jempol.
   Satu tema, disengaja: marun kain batik, emas kotak kas, dan pastel kue lapis untuk gelembung chat. */
:root{
  --maroon:#4b1424;
  --maroon-deep:#350c19;
  --panel:#62203a;
  --line:#7c3550;
  --fg:#fff1e6;
  --muted:#e2bcc6;
  --emas:#f2b632;
  --pandan:#7cc49a;
  --lapis:#f49cb0;
  --danger:#ff6b6b;
  --paper:#fff6ec;
  --ink:#2b1a1f;
  --ink-muted:#7a5f66;
  --display:"Baloo 2", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
  --body:"Nunito", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--maroon);color:var(--fg)}
body{font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#app{
  height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
.top{flex:none;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--maroon-deep)}
.top h1,.top h2{font-family:var(--display);font-weight:800;margin:0;line-height:1.05}
.top h2{font-size:1.15rem}
.top .sub{font-size:12px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.bottom{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-top:1px solid var(--line);background:var(--maroon-deep)}
.bottom .primary{flex:1 1 auto}

h1.logo{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,12.5vw,3.9rem);letter-spacing:.01em;line-height:.92;margin:0;color:var(--emas)}
.hook{font-size:17px;line-height:1.45;margin:0}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0;padding:0;list-style:none}
.steps3 li{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 8px;text-align:center;font-size:13px;font-weight:700;line-height:1.3}
.steps3 li b{display:block;font-size:24px;line-height:1.1;margin-bottom:4px}
.cta{padding:18px 16px!important;align-items:center!important;text-align:center!important}
.cta b{font-size:1.45rem!important}
h2{font-family:var(--display);font-weight:800;font-size:1.45rem;line-height:1.15;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:800;font-size:1.05rem;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.portal-back{display:block;width:fit-content;font-size:13px;font-weight:800;color:var(--muted);text-decoration:none;padding:6px 0;margin-bottom:2px}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--emas)}

button{
  font:inherit;font-weight:800;color:var(--fg);background:var(--panel);border:2px solid var(--line);
  border-radius:14px;padding:11px 16px;cursor:pointer;touch-action:manipulation;
}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.45;cursor:not-allowed}
button.primary{background:var(--emas);border-color:var(--emas);color:var(--ink)}
button.ghost{background:transparent}
button.small{padding:7px 12px;font-size:14px;border-radius:11px}
button:focus-visible,input:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
input[type=text]{font:inherit;font-size:17px;color:var(--ink);background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}

.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.menu{display:flex;flex-direction:column;gap:10px}
.menu button{text-align:left;display:flex;flex-direction:column;gap:2px;padding:14px 16px}
.menu button b{font-family:var(--display);font-size:1.15rem}
.menu button span{font-weight:600;font-size:14px;color:var(--muted)}
.menu button.primary span{color:#5a3a10}
.bar{height:8px;border-radius:4px;background:var(--maroon-deep);overflow:hidden}
.bar i{display:block;height:100%;background:var(--emas)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--maroon-deep);border:1px solid var(--line);white-space:nowrap}
.kue{color:var(--lapis)}

/* avatar */
.av{flex:none;display:inline-block;position:relative;line-height:0}
.av svg{display:block}
.av .sandal{position:absolute;right:-5px;bottom:-4px;line-height:0;filter:drop-shadow(0 1px 1.5px rgba(0,0,0,.7))}
.sandal-ic{display:inline-block;vertical-align:-4px;line-height:0;margin-right:4px}
.swatch{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px;border:1.5px solid #fff8ee}
.av.out svg{filter:grayscale(1) opacity(.45)}

/* pilih orang */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.person{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border-radius:14px;background:var(--panel);border:2px solid var(--line);color:var(--fg);font-weight:700;font-size:14px;text-align:center}
.person.sel{border-color:var(--emas);background:var(--maroon-deep)}
.person .tag{font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap}
.person[disabled]{opacity:.4}

/* kartu peran */
.rolecard{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--paper);color:var(--ink)}
.rolecard .rname{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1}
.rolecard.bandar{background:#2b0d16;color:var(--fg);border:2px solid var(--danger)}
.rolecard.bandar .rname{color:var(--danger)}
.result{border-radius:14px;padding:12px 14px;background:var(--paper);color:var(--ink);font-weight:700}
.result.bad{background:#ffd9d9;color:#7a1010}
.result.good{background:#d7f3e1;color:#14532d}

/* chat */
.chathead{flex:none;display:flex;flex-direction:column;gap:6px;padding-block:8px 10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--maroon-deep);border-bottom:1px solid var(--line)}
.kas{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px}
.kas .v{color:var(--emas);font-variant-numeric:tabular-nums}
.kasbar{position:relative;height:8px;border-radius:4px;background:#2b0d16;overflow:hidden}
.kasbar i{position:absolute;left:0;top:0;bottom:0;background:var(--emas)}
.kasbar b{position:absolute;top:0;bottom:0;width:2px;background:var(--danger)}
.members{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.feed{flex:1;overflow-y:auto;padding-block:12px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:8px;background:#3d1020}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg .bubble{background:var(--paper);color:var(--ink);border-radius:14px 14px 14px 4px;padding:7px 11px;font-size:15px;min-width:0}
.msg .who{display:block;font-size:12px;font-weight:800;margin-bottom:1px}
.msg .who small{font-weight:700;color:var(--ink-muted)}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg.me .bubble{background:#ffe3a3;border-radius:14px 14px 4px 14px}
.msg.claim .bubble{border:2px solid var(--emas)}
.sys{align-self:center;max-width:94%;text-align:center;background:rgba(0,0,0,.28);color:var(--fg);font-size:13px;font-weight:700;padding:6px 12px;border-radius:12px}
.sys.news{background:#2b0d16;border:1px solid var(--line);text-align:left}
.sys.alert{background:var(--danger);color:#2b0000}
.typing{align-self:flex-start;font-size:13px;color:var(--muted);font-style:italic;padding-left:4px}
.composer{flex:none;display:flex;flex-direction:column;gap:8px;padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));background:var(--maroon-deep);border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chips button{flex:none;padding:7px 12px;font-size:14px;border-radius:999px}
.chips button.on{background:var(--emas);color:var(--ink);border-color:var(--emas)}
.targets{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.targets button{flex:none;display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;font-size:13px;border-radius:999px}
.targets button.on{border-color:var(--emas);background:var(--panel)}

/* voting */
.poll{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:14px;background:var(--panel);border:2px solid var(--line);text-align:left;color:var(--fg)}
.opt.sel{border-color:var(--emas)}
.opt .vbar{grid-column:2 / 4;height:6px;border-radius:3px;background:var(--maroon-deep);overflow:hidden}
.opt .vbar i{display:block;height:100%;background:var(--lapis);width:0;transition:width .4s}
.opt .count{font-weight:800;font-variant-numeric:tabular-nums}
.voters{grid-column:2 / 4;display:flex;gap:3px;flex-wrap:wrap}

.handoff{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
.handoff .big{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1.1}
.timer{font-family:var(--display);font-weight:800;font-size:3.2rem;color:var(--emas);font-variant-numeric:tabular-nums;text-align:center;line-height:1}

.endbanner{border-radius:18px;padding:18px;text-align:center;display:flex;flex-direction:column;gap:6px}
.endbanner.win{background:var(--pandan);color:var(--ink)}
.endbanner.lose{background:#2b0d16;border:2px solid var(--danger)}
.endbanner .big{font-family:var(--display);font-weight:800;font-size:1.8rem;line-height:1.05}
.rolelist{display:flex;flex-direction:column;gap:6px}
.rolelist div{display:flex;align-items:center;gap:10px;font-weight:700}
.rolelist div > span:nth-child(2){flex:1;min-width:0}
.rolelist .r{margin-left:auto;font-size:13px;font-weight:800;white-space:nowrap;flex:none}
.rolelist .r.bandar{color:var(--danger)}
.reward{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;text-align:center}
.reward div{background:var(--maroon-deep);border:1px solid var(--line);border-radius:12px;padding:8px}
.reward b{display:block;font-family:var(--display);font-size:1.3rem}
.kocok{display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center}
.kocok .slot{font-family:var(--display);font-weight:800;font-size:1.5rem;padding:10px 16px;border-radius:14px;background:var(--paper);color:var(--ink);min-width:70%}
.kocok .slot.won{background:var(--emas)}
.share{font-size:13px;white-space:pre-wrap;background:var(--maroon-deep);border:1px dashed var(--line);border-radius:12px;padding:10px;user-select:all}
.ach{display:flex;gap:10px;align-items:flex-start;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.ach.locked{opacity:.5}
.ach .ico{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--maroon-deep);font-family:var(--display);font-weight:800;color:var(--emas)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.swatch{width:30px;height:30px;border-radius:9px;border:2px solid var(--fg)}
.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:calc(100% - 32px);z-index:50;background:var(--paper);color:var(--ink);font-weight:800;font-size:14px;padding:8px 14px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
details{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
details summary{cursor:pointer;font-weight:800}
details[open] summary{margin-bottom:8px}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper b{font-family:var(--display);font-size:1.6rem;min-width:2ch;text-align:center}
.msg.cry .bubble{background:#ffe0e6}
.msg.salah .bubble{border:2px dashed var(--lapis)}
.msg .bubble.deleted .txt{font-style:italic;color:var(--ink-muted)}
.sys.drama{background:var(--lapis);color:var(--ink)}
.pill.heat{flex:none}
#msgForm{gap:8px}
#msgForm input{flex:1;min-width:0;font-size:16px;padding:9px 12px}
.lastwords{display:flex;gap:10px;align-items:flex-end}
.lastwords .bubble{background:var(--paper);color:var(--ink);border-radius:14px 14px 14px 4px;padding:9px 12px;font-weight:700}
.suspense{font-family:var(--display);font-weight:800;font-size:1.6rem;text-align:center;color:var(--emas)}
@media (prefers-reduced-motion:no-preference){.suspense{animation:pulse .5s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.4}to{opacity:1}}}
.sp-chip{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.03em;padding:1px 7px;border-radius:999px;background:var(--emas);color:var(--ink);vertical-align:1px;white-space:nowrap}
.sp-line{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--muted)}
.sp-box{display:flex;flex-direction:column;gap:4px;align-items:center;background:var(--maroon-deep);border:1px dashed var(--emas);border-radius:12px;padding:8px 10px;width:100%}
.sp-link{font-size:13px;font-weight:800;color:var(--emas);white-space:nowrap}
.sp-under{display:block;margin-top:4px}
.sys.narr{background:transparent;color:var(--muted);font-style:italic;font-weight:600}
.msg .quote{display:block;font-size:12px;color:var(--ink-muted);border-left:3px solid var(--lapis);padding:1px 0 1px 7px;margin:2px 0 4px;background:rgba(0,0,0,.04);border-radius:3px}
.reacts{display:block;margin-top:4px;font-size:12px;font-weight:700;color:var(--ink-muted)}
.vlog{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.vline{display:flex;gap:8px;align-items:center;font-size:14px;background:var(--maroon-deep);border:1px solid var(--line);border-radius:12px;padding:6px 10px}
.sheet-bg{position:fixed;inset:0;z-index:40;background:rgba(10,2,6,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;background:var(--maroon-deep);border:1px solid var(--line);border-bottom:0;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:12px;
  padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:85%;overflow-y:auto}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet .acts3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sheet .seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sheet .seg button.on{background:var(--emas);color:var(--ink);border-color:var(--emas)}
.sheet .who-head{display:flex;gap:12px;align-items:center}
.iconbtn{padding:6px 12px;font-size:18px;line-height:1;border-radius:12px}
.mem{background:none;border:0;padding:0;border-radius:50%;cursor:pointer}
.msg .avbtn{background:none;border:0;padding:0;border-radius:50%;cursor:pointer;line-height:0}
.stage-btn{width:100%;padding:9px 14px;font-size:15px}
.stage-btn.ready{background:var(--emas);color:var(--ink);border-color:var(--emas)}
@media (prefers-reduced-motion:no-preference){.stage-btn.ready{animation:nudge 1.4s ease-in-out infinite}@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(242,182,50,.55)}50%{box-shadow:0 0 0 6px rgba(242,182,50,0)}}}
.coach{width:100%;flex:none;
  background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-weight:700;font-size:14px}
.coach button{flex:none;padding:6px 12px;font-size:14px;background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:15px}
.rrow b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.75;padding-top:2px}
.rolecard details{background:transparent;border:0;padding:0;font-size:14px}
.rolecard details summary{font-weight:800;opacity:.8}
.vlast{background:var(--paper);color:var(--ink);border-radius:12px;padding:8px 12px;font-weight:700;font-size:14px;display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap;gap:8px}
.linkish{background:none;border:0;padding:6px 0;color:var(--muted);text-decoration:underline;font-weight:700;align-self:center}
.card.profile{flex-direction:row;gap:12px;align-items:center;text-align:left}
.profile .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.profile .nm{background:none;border:0;padding:0;color:var(--fg);font-weight:800;text-align:left;font-size:16px;text-decoration:underline dotted;text-underline-offset:3px}
.bottom.stack{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bottom.stack .primary{grid-column:1 / -1}
.bottom.stack > :nth-child(2):last-child{grid-column:1 / -1}
.pop{animation:popin .32s ease-out both}
@keyframes popin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.toast,.opt .vbar i{transition:none}.pop{animation:none}}
</style>

<script>
(function(){
'use strict';

/* ================= util ================= */
const app=document.getElementById('app');

/* ================= OTAK YANG BELAJAR =================
   brain.json dilatih mingguan dari catatan permainan pemain yang setuju (lihat LEARNING.md).
   Isinya hanya data: slang baru, model kata (naive Bayes) untuk pesan yang tidak tertangkap aturan,
   dan "gelagat" pemain manusia yang bandar. Semua dibatasi supaya file yang rusak tidak bisa merusak game. */
const BRAIN_URL='https://thofik93.github.io/arisan/brain.json';
const LEARN_API='https://arisan-brain.thofik93.workers.dev';// server Cloudflare (server/)
const REC_V=1;
const NB_CLASSES=['accuse','defend','deny','question','ask_alibi','ask_why','ask_role','greet','laugh','chat'];
const TELL_KEYS=['acc','acc2','def','deny','quiet','claim','ask'];
let BRAIN=null,SLANG_LEARNED=[];
/* Sakelar fitur: brain.json → exp:{nama: 0..1} menyalakan fitur untuk sebagian pemain saja, supaya bisa dibandingkan.
   Pembagiannya dari angka acak yang hanya disimpan di perangkat (tidak dikirim). */
const FLAG_DEFAULTS={probe:1,callout:1,adaptiveBandar:1,learnedLR:1};
function installSeed(){let x=store.get('expSeed',null);if(typeof x!=='number'){x=Math.floor(Math.random()*1e9);store.set('expSeed',x);}return x;}
function flag(name){
  const pct=BRAIN&&BRAIN.exp&&typeof BRAIN.exp[name]==='number'?BRAIN.exp[name]:(FLAG_DEFAULTS[name]??1);
  if(pct>=1)return true;if(pct<=0)return false;
  let h=installSeed();for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;return (h%1000)/1000<pct;
}
/* Bobot bukti: nilai bawaan sama persis dengan rumus lama; brain.json → lr menggantinya dengan angka dari permainan nyata */
const LR_DEFAULT={reportOut:1.8,reportIn:1/3.5,gosipT:2.5,gosipF:1/1.8,bendT:6,bendF:.25,accuse:1.5,defend:1/1.35,humanAccuse:1.5,humanDefend:1/1.35};
const lrOf=k=>(G&&G.flags&&G.flags.learnedLR&&BRAIN&&BRAIN.lr&&typeof BRAIN.lr[k]==='number')?BRAIN.lr[k]:LR_DEFAULT[k];
const lrf=(lr,c)=>lr>=1?1+(lr-1)*c:1/(1+(1/lr-1)*c);
const isNative=()=>{const C=window.Capacitor;return !!(C&&C.isNativePlatform&&C.isNativePlatform());};
function validBrain(j){
  if(!j||typeof j!=='object'||typeof j.version!=='number')return null;
  const num=x=>typeof x==='number'&&isFinite(x);
  const out={version:j.version,slang:[],nb:null,tells:null};
  if(Array.isArray(j.slang))out.slang=j.slang.filter(x=>Array.isArray(x)&&/^[a-z]{2,20}$/.test(x[0])&&/^[a-z ]{2,30}$/.test(x[1])).slice(0,300);
  if(j.nb&&Array.isArray(j.nb.classes)&&j.nb.prior&&j.nb.w&&typeof j.nb.w==='object'){
    const classes=j.nb.classes.filter(c=>NB_CLASSES.includes(c)&&num(j.nb.prior[c]));
    if(classes.length>=2)out.nb={classes,prior:j.nb.prior,w:j.nb.w,min:Math.max(.6,Math.min(.99,num(j.nb.min)?j.nb.min:.85)),override:num(j.nb.override)?Math.max(.75,Math.min(.99,j.nb.override)):null};
  }
  if(j.tells&&typeof j.tells==='object'){out.tells={};for(const k of TELL_KEYS)if(num(j.tells[k]))out.tells[k]=Math.max(.6,Math.min(1.6,j.tells[k]));}
  if(j.exp&&typeof j.exp==='object'){out.exp={};for(const k of Object.keys(FLAG_DEFAULTS))if(num(j.exp[k]))out.exp[k]=Math.max(0,Math.min(1,j.exp[k]));}
  if(j.lr&&typeof j.lr==='object'){out.lr={};for(const k of Object.keys(LR_DEFAULT))if(num(j.lr[k]))out.lr[k]=Math.max(.15,Math.min(10,j.lr[k]));}
  if(j.bandar&&typeof j.bandar==='object'){out.bandar={};for(const k of BANDAR_STRATEGIES)if(num(j.bandar[k]))out.bandar[k]=Math.max(.2,Math.min(5,j.bandar[k]));}
  return out;
}
function applyBrain(){SLANG_LEARNED=(BRAIN&&BRAIN.slang||[]).map(([a,b])=>[new RegExp('\\b'+a+'\\b','g'),b]);}
async function loadBrain(){
  BRAIN=validBrain(store.get('brain',null));applyBrain();

  try{
    const r=await fetch(isNative()?BRAIN_URL:'brain.json',{cache:'no-cache'});if(!r.ok)return;

}
/* Model kata: menebak maksud pesan yang tidak tertangkap aturan */
function nbTokens(words,ments){
  const w=words.map((x,i)=>ments.some(m=>m.i===i)?'xp':x).filter(x=>x&&!/^[,.!;?]$/.test(x));
  const out=[...w];for(let i=0;i+1<w.length;i++)out.push(w[i]+'_'+w[i+1]);return out;
}
function nbGuess(tokens){
  const nb=BRAIN&&BRAIN.nb;if(!nb)return null;
  const sc={};let known=0;
  for(const c of nb.classes)sc[c]=nb.prior[c];
  for(const t of tokens){const w=nb.w[t];if(!w||typeof w!=='object')continue;known++;for(const c of nb.classes)sc[c]+=typeof w[c]==='number'?w[c]:-12;}
  if(!known)return null;
  const mx=Math.max(...Object.values(sc));let z=0;for(const c in sc)z+=Math.exp(sc[c]-mx);
  const best=nb.classes.reduce((a,b)=>sc[b]>sc[a]?b:a);
  return 1/z>=nb.min?{cls:best,p:1/z}:null;
}
/* Gelagat: bot belajar dari permainan sungguhan seperti apa pemain manusia yang jadi bandar */
function humanTellsToday(me){
  const hs=(G.rec&&G.rec.human||[]).filter(h=>h.d===G.day),c=l=>hs.filter(h=>h.l===l).length;
  return{acc:c('accuse')>=1,acc2:c('accuse')>=2,def:c('defend')>=1,deny:c('deny')+c('swear')>=1,quiet:hs.length===0,claim:c('claimBend')>=1,ask:hs.some(h=>/^ask_/.test(h.l))};
}
function applyTells(){
  const me=human(),t=BRAIN&&BRAIN.tells;
  if(!t||!me||!me.alive||G.mode!=='bot'||G.tellsDay===G.day)return;
  G.tellsDay=G.day;
  const f=humanTellsToday(me);let lr=1;
  for(const k of TELL_KEYS)if(f[k]&&t[k])lr*=t[k];
  lr=Math.max(.6,Math.min(1.6,lr));
  for(const v of alive())if(!v.human&&v.role!=='bandar')mulBelief(v,me.id,lr);
}
/* Catatan permainan: hanya dikirim kalau pemain setuju. Nama diganti penanda, tanpa ID perangkat. */
function recordGame(result){
  if(!G||!G.rec||G.rec.sent)return null;
  G.rec.sent=true;
  return{...G.rec,sent:undefined,speed:chatSpeed,result,day:G.day,winner:G.winner,dur:Math.round((Date.now()-G.rec.start)/1000),start:undefined,
    players:G.players.map(p=>({role:p.role,bot:p.bot||null,human:!!p.human,alive:p.alive,out:p.kickedDay||null})),
    votes:G.votes.map(v=>({d:v.day,k:v.kicked,v:v.votes})),
    news:(G.newsLog||[]).filter(n=>['fitnah','sandal','paket','klarifikasi'].includes(n.type)).slice(0,30).map(n=>({d:n.day,y:n.type,t:n.target??null,c:n.color??null})),
    msgs:G.allMsgs.filter(m=>m.from!=null&&!pl(m.from).human).slice(0,400).map(m=>({d:m.day,f:m.from,y:m.type,t:m.target??null,v:m.value??null,c:m.core||null}))};
}
function queueRecord(rec){
  if(!rec)return;
  const box=store.get('outbox',[]);box.push(rec);store.set('outbox',box.slice(-20));flushOutbox();
}
async function flushOutbox(){
  // dari file lokal (uji otomatis, pratinjau) tidak pernah mengirim ke server produksi
  if(!LEARN_API||P.share!==true||(location.protocol==='file:'&&!isNative()))return;
  const box=store.get('outbox',[]);
  while(box.length){
    try{const r=await fetch(LEARN_API+'/v1/games',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(box[0]),keepalive:true});if(!r.ok&&r.status<500){box.shift();continue;}if(!r.ok)break;box.shift();}
    catch(e){break;}
  }
  store.set('outbox',box);
}
function shareGame(result){
  const rec=recordGame(result);if(!rec)return;
  if(P.share===true)return queueRecord(rec);
  if(P.share===false||result==='quit')return;
  // pertama kali: tanya izin di layar akhir
  setTimeout(()=>openSheet(`<h3>Bantu ibu-ibu bot makin pintar?</h3>
    <p class="small">Kirim catatan permainan ini secara anonim: hasil, voting, dan pesan yang kamu ketik. Nama diganti penanda, tanpa akun dan tanpa ID perangkat. Dari catatan semua pemain, bot belajar memahami bahasamu dan membaca gelagat.</p>
    <p class="small muted">Bisa dimatikan kapan saja di menu ⋯.</p>
    <div class="bottom stack" style="border:0;padding:0;background:none"><button class="primary" data-act="yes">Ya, bantu</button><button data-act="no">Tidak</button></div>`,b=>{
      if(!b.dataset.act)return;P.share=b.dataset.act==='yes';saveP();closeSheet();if(P.share)queueRecord(rec);
    }),1600);
}

let G=null;
function pickStrategy(){
  if(G0force)return G0force;
  const w=BRAIN&&BRAIN.bandar&&flag('adaptiveBandar')?BRAIN.bandar:null;
  if(!w)return pickR(BANDAR_STRATEGIES);
  const tot=BANDAR_STRATEGIES.reduce((a,k)=>a+(w[k]??1),0);let r=rnd()*tot;
  for(const k of BANDAR_STRATEGIES){r-=w[k]??1;if(r<=0)return k;}return BANDAR_STRATEGIES[0];
}
let G0force=null;// dipakai simulasi untuk menguji satu strategi
function newGame(opts){
  // opts: {mode:'bot'|'pass'|'sim', n, names?, seed?, daily?}
  R=opts.seed!=null?mulberry32(opts.seed):Math.random;
  const n=opts.n;
  const roles=shuffle(roleList(n));
  let players;
  if(opts.mode==='pass'){
    players=opts.names.map((nm,i)=>{const b=BOTS[i%BOTS.length];return{name:nm,human:true,bot:null,hijab:b.hijab,skin:b.skin,hair:b.hair,look:b.look};});
  }else{
    const bots=shuffle(BOTS).slice(0,opts.mode==='sim'?n:n-1);
    players=bots.map(b=>({name:b.name,bot:b.pers,human:false,hijab:b.hijab,skin:b.skin,hair:b.hair,look:b.look}));
    if(opts.mode!=='sim'){
      const look=humanLook();
      players.unshift({name:'Bu '+(P.name||'Tamu'),bot:null,human:true,...look,title:(cos('title',P.title)||{}).text||''});
    }
  }
  players.forEach((p,i)=>{p.id=i;p.role=roles[i];p.alive=true;p.beliefs={};p.saidInfo=false;p.votesGot=0;p.framed=0;
    p.grudge={};p.mood=0;p.accusedCount=0;p.knowledge=[];p.alibi=null;p.alibiSaid=null;if(p.role==='bandar'&&p.bot)p.strategy=pickStrategy();});
  // sandal: tiap bandar berbagi warna dengan minimal satu warga
  const order=shuffle(players.map(p=>p.id));
  order.forEach((id,k)=>{const s=SANDAL[k%SANDAL.length];players[id].sandal=s[0];players[id].sandalHex=s[1];});
  for(const b of players.filter(p=>p.role==='bandar')){
    if(players.filter(p=>p.sandal===b.sandal).length<2){
      const other=players.find(p=>p.role!=='bandar'&&players.filter(q=>q.sandal===p.sandal).length>=2)||players.find(p=>p.role!=='bandar');
      [b.sandal,b.sandalHex]=[other.sandal,other.sandalHex];
    }
  }
  const k=roles.filter(r=>r==='bandar').length;
  for(const v of players)for(const t of players)if(t!==v)v.beliefs[t.id]=k/(n-1-k);
  G={mode:opts.mode,daily:!!opts.daily,seed:opts.seed,n,players,day:1,kas:KAS_START,phase:'night',
     night:{actions:{},results:{}},news:[],msgs:[],allMsgs:[],bendClaimers:[],votes:[],kicked:[],
     winner:null,reason:'',humanStats:{statements:0,votedBandar:0,votes:0,framed:false},token:0,
     used:new Set(),shotDone:new Set(),heat:0,newsLog:[]};
  G.flags={};for(const k of Object.keys(FLAG_DEFAULTS))G.flags[k]=flag(k);
  G.hAlibi={};G.hStance={};
  if(opts.mode==='bot')G.rec={exp:{...G.flags},v:REC_V,brain:BRAIN?BRAIN.version:0,n,daily:!!opts.daily,start:Date.now(),human:[]};
  // alur sinetron: sepasang musuh bebuyutan dan sepasang besti di antara bot
  const botIds=shuffle(players.filter(p=>!p.human).map(p=>p.id));
  if(botIds.length>=4){
    const [a,b,c,d]=botIds;G.rivals=[a,b];G.besties=[c,d];
    bump(a,b,2);bump(b,a,2);bump(c,d,-2);bump(d,c,-2);
    for(const [x,y,f] of [[a,b,1.4],[b,a,1.4],[c,d,.6],[d,c,.6]])mulBelief(pl(x),y,f);
  }
  return G;
}
const pl=id=>G.players[id];
const alive=()=>G.players.filter(p=>p.alive);
const isBandar=id=>pl(id).role==='bandar';
const human=()=>G.players.find(p=>p.human&&G.mode!=='pass');
function prob(v,j){const o=v.beliefs[j];return o/(1+o);}
function pubSusp(j){
  const viewers=alive().filter(v=>v.id!==j&&v.role!=='bandar'&&!v.human);
  if(!viewers.length)return .3;
  return viewers.reduce((s,v)=>s+prob(v,j),0)/viewers.length;
}
function mulBelief(v,j,f){if(v.id===j||v.role==='bandar'||v.human)return;v.beliefs[j]=clamp(v.beliefs[j]*f,1e-4,1e4);}
function knowInnocent(v,j){v.beliefs[j]=1e-4;}
function knowBandar(v,j){v.beliefs[j]=1e4;}
function cred(v,from){return clamp(1-prob(v,from)*1.5,.05,1);}
function topSuspect(v,excl){let best=null,bp=-1;for(const p of alive()){if(p.id===v.id||(excl&&excl.has(p.id)))continue;const q=prob(v,p.id);if(q>bp){bp=q;best=p;}}return best;}
function lowSuspect(v){let best=null,bp=2;for(const p of alive()){if(p.id===v.id)continue;const q=prob(v,p.id);if(q<bp){bp=q;best=p;}}return best;}

/* ---------- malam ---------- */
function botNightAction(p){
  const others=alive().filter(q=>q.id!==p.id);
  if(p.role==='bandar'){
    const inn=others.filter(q=>q.role!=='bandar');
    const claimer=inn.find(q=>G.bendClaimers.includes(q.id));
    if(claimer&&rnd()<.7)return claimer.id;
    return inn.sort((a,b)=>pubSusp(a.id)-pubSusp(b.id))[ri(Math.min(2,inn.length))].id;
  }
  if(p.role==='ketua'){
    const claimer=others.find(q=>G.bendClaimers.includes(q.id)&&prob(p,q.id)<.4);
    if(claimer&&rnd()<.6)return claimer.id;
    return lowSuspect(p).id;
  }
  // bendahara, gosip, warga: selidiki yang paling dicurigai tapi belum pasti
  const cand=others.filter(q=>{const x=prob(p,q.id);return x>.01&&x<.99;});
  const pool=cand.length?cand:others;
  const noise=PERS[p.bot]?PERS[p.bot].noise:.15;
  return pool.map(q=>({q,s:prob(p,q.id)+rnd()*noise})).sort((a,b)=>b.s-a.s)[0].q.id;
}
function resolveNight(){
  const A=G.night.actions,res={},news=[];
  const bandars=alive().filter(p=>p.role==='bandar');
  let take=0;
  if(bandars.length){take=Math.round((1.15e6+rnd()*.25e6)/1e4)*1e4;G.kas-=take;}
  news.push({type:'kas',take});
  const protect=new Set(alive().filter(p=>p.role==='ketua'&&A[p.id]!=null).map(p=>A[p.id]));
  let fitnah=null;
  for(const b of bandars)if(A[b.id]!=null){fitnah=A[b.id];break;}
  const blocked=fitnah!=null&&protect.has(fitnah);
  const distracted=fitnah!=null&&!blocked&&!isBandar(fitnah)?fitnah:null;
  for(const p of alive()){
    const t=A[p.id];if(t==null)continue;
    if(p.id===distracted&&p.role!=='ketua'){res[p.id]={type:'ngerumpi',target:t};continue;}
    if(p.role==='bendahara')res[p.id]={type:'audit',target:t,value:isBandar(t)};
    else if(p.role==='gosip'){const truth=isBandar(t);res[p.id]={type:'gosip',target:t,value:rnd()<TUNE.gosipAcc?truth:!truth};}
    else if(p.role==='warga')res[p.id]={type:'intip',target:t,value:wentOut(pl(t))&&rnd()<TUNE.intipSeen};
    else if(p.role==='ketua')res[p.id]={type:'jaga',target:t,value:blocked&&fitnah===t};
    else if(p.role==='bandar')res[p.id]={type:'fitnah',target:t,value:t===fitnah&&!blocked};
  }
  if(fitnah!=null){
    if(blocked)news.push({type:'klarifikasi',target:fitnah});
    else{news.push({type:'fitnah',target:fitnah,text:pickR(FITNAH)});pl(fitnah).framed++;}
  }
  if(bandars.length&&rnd()<TUNE.sandalP)news.push({type:'sandal',color:pickR(bandars).sandal});
  G.night.results=res;G.news=news;
  G.newsLog.push(...news.map(n=>({...n,day:G.day})));
  for(const p of alive()){const r=res[p.id];if(r&&['audit','gosip','intip','jaga'].includes(r.type))p.knowledge.push({day:G.day,...r});}
  // pengetahuan pribadi bot
  for(const p of alive()){
    const r=res[p.id];if(!r||p.human)continue;
    if(r.type==='audit'){r.value?knowBandar(p,r.target):knowInnocent(p,r.target);p.audited=(p.audited||[]).concat(r.target);}
    else if(r.type==='gosip')mulBelief(p,r.target,r.value?3:1/3);
    else if(r.type==='intip')mulBelief(p,r.target,r.value?1.5:TUNE.intipQuiet);
  }
  // kabar pagi untuk semua bot
  for(const v of alive()){
    if(v.human||v.role==='bandar')continue;
    for(const nw of news){
      if(nw.type==='fitnah')mulBelief(v,nw.target,Math.pow(PERS[v.bot].gull,TUNE.gullPow));
      else if(nw.type==='klarifikasi')mulBelief(v,nw.target,.8);
      else if(nw.type==='sandal'){
        for(const q of alive())if(q.sandal===nw.color)mulBelief(v,q.id,v.sandal===nw.color?TUNE.sandalSelfF:TUNE.sandalF);
      }
    }
  }
  for(const p of G.players){p.saidInfo=false;p.denied=false;p.mood=Math.max(0,p.mood-1);p.ngambek=false;p.defendedBestie=false;p.replies=0;}
  G.msgs=[];G.phase='day';G.heat=0;
}

function lowerFirst(s){return /^(Bu|TUH|[A-Z]{2,})\b/.test(s)?s:s.charAt(0).toLowerCase()+s.slice(1);}
function fillCore(c,vars){return c.replace(/\{(\w)\}/g,(_,k)=>vars[k]||'');}
/* Menyusun satu kalimat: inti + gaya bicara + emosi, sebisa mungkin tidak mengulang kalimat yang sudah dipakai */
function compose(p,core,vars){
  const arr=CORE[core]||CORE.flavor;
  let line=null;
  for(let i=0;i<6;i++){line=fillCore(pickR(arr),vars);if(!G.used.has(line))break;}
  G.used.add(line);
  if(!p.bot||PLAIN.has(core))return line;
  const v=VOICE[p.bot][INTENT[core]||'neutral'];
  let out=line;
  if(v.o.length&&rnd()<.4&&!INTERJ.test(out)){const o=pickR(v.o);out=o+' '+(/[.…!?:]$/.test(o)?out:lowerFirst(out));}
  if(v.c.length&&rnd()<.35&&!/[?]$/.test(out)&&!/\p{Extended_Pictographic}$/u.test(out))out=out+' '+pickR(v.c);
  if(p.mood>=2&&rnd()<.4)out=out.replace(/[.…]$/,'!');
  if(p.mood>=3&&rnd()<.2&&out.length<70&&(INTENT[core]==='deny'||INTENT[core]==='accuse'))out=out.toUpperCase();
  return out;
}

const ROLE_LOW={bandar:'bandar',bendahara:'Bendahara',ketua:'Bu RT',gosip:'Ratu Gosip',warga:'warga biasa'};

/* ---------- deduksi ---------- */
function deductions(v){
  const out=[],me=v.id;
  const aliveOther=id=>id!==me&&pl(id).alive;
  for(const m of G.allMsgs){
    // klaim Bendahara yang terbukti salah setelah peran dibuka
    if(m.type==='claimBend'&&m.target!=null&&!pl(m.target).alive&&aliveOther(m.from)){
      const truth=pl(m.target).role==='bandar';
      if(truth!==m.value)out.push({kind:'liar',target:m.from,strength:.95,about:m.target,said:m.value,role:pl(m.target).role,day:m.day});
    }
    // membela bandar yang sudah terbukti
    if(m.type==='defend'&&m.target!=null&&!pl(m.target).alive&&pl(m.target).role==='bandar'&&aliveOther(m.from))
      out.push({kind:'defendedBandar',target:m.from,strength:.6,about:m.target});
    // laporan orang lain bahwa seseorang keluar rumah
    if(m.type==='report'&&m.value&&m.target!=null&&aliveOther(m.target)&&m.from!==me)
      out.push({kind:'seenOut',target:m.target,by:m.from,strength:.35});
  }
  // dua orang mengaku Bendahara
  const bc=G.bendClaimers.filter(x=>aliveOther(x));
  if(v.role==='bendahara'&&!v.human){for(const x of bc)out.push({kind:'fakeBend',target:x,strength:.98});}
  else if(bc.length>=2){
    const liars=new Set(out.filter(d=>d.kind==='liar').map(d=>d.target));
    const [a,b]=bc.slice().sort((x,y)=>(liars.has(y)-liars.has(x))||(prob(v,y)-prob(v,x)));
    out.push({kind:'twoClaims',target:a,other:b,strength:.55});
  }
  // petunjuk sandal dan CCTV: kandidat dikurangi yang sudah pasti bersih
  for(const nw of G.newsLog){
    if(nw.type!=='sandal'&&nw.type!=='cctv')continue;
    const match=q=>nw.type==='sandal'?q.sandal===nw.color:lookOf(q)===nw.look;
    const cands=alive().filter(q=>q.id!==me&&match(q));
    if(!cands.length)continue;
    const elim=cands.filter(q=>prob(v,q.id)<.06),rest=cands.filter(q=>prob(v,q.id)>=.06);
    const what=nw.type==='sandal'?`sandal ${nw.color}`:nw.look;
    if(rest.length===1&&cands.length>1)out.push({kind:'deduce',target:rest[0].id,strength:.85,what,cands:cands.map(q=>q.id),elim:elim.map(q=>q.id),src:nw.type});
    else for(const q of rest)out.push({kind:'clue',target:q.id,strength:.4,what,others:cands.filter(x=>x!==q).map(x=>x.id),src:nw.type});
  }
  // pengetahuan sendiri dari malam
  for(const k of v.knowledge||[]){
    if(!pl(k.target).alive||k.target===me)continue;
    if(k.type==='audit')out.push({kind:'ownAudit',target:k.target,strength:k.value?1:-1,value:k.value,day:k.day});
    if(k.type==='intip')out.push({kind:'ownIntip',target:k.target,strength:k.value?.55:-.4,value:k.value,day:k.day});
    if(k.type==='gosip')out.push({kind:'ownGosip',target:k.target,strength:k.value?.45:-.3,value:k.value,day:k.day});
  }
  // pola voting: memilih orang yang ternyata bersih
  const badVotes={};
  for(const vt of G.votes)for(const [voter,x] of vt.votes)if(vt.kicked===x&&pl(x).role!=='bandar'&&aliveOther(voter))(badVotes[voter]=badVotes[voter]||[]).push(x);
  for(const [voter,xs] of Object.entries(badVotes))out.push({kind:'votePattern',target:+voter,strength:.3+.15*xs.length,victims:xs});
  // alibi yang berubah untuk malam yang sama
  for(const p of alive())if(p.id!==me&&p.alibi)for(const [d,a] of Object.entries(p.alibi))if(a.length>1&&p.alibiSaid&&p.alibiSaid[d]>1)out.push({kind:'alibi',target:p.id,strength:.75,a1:a[0],a2:a[1]});
  // yang menyerang aku berkali-kali
  const atk={};for(const m of G.msgs)if(m.target===me&&(m.type==='accuse'||(m.type==='claimBend'&&m.value))&&aliveOther(m.from))atk[m.from]=(atk[m.from]||0)+1;
  for(const [a,c] of Object.entries(atk))if(c>=2)out.push({kind:'attacker',target:+a,strength:.3,count:c});
  // kabar dan salah kirim
  for(const nw of G.newsLog)if(nw.type==='fitnah'&&aliveOther(nw.target))out.push({kind:'rumor',target:nw.target,strength:.2,text:nw.text});
  for(const p of alive())if(p.id!==me&&p.salahSus)out.push({kind:'salah',target:p.id,strength:.35});
  return out.sort((a,b)=>b.strength-a.strength);
}

/* Teks generatif untuk pesan non-skenario; mengembalikan null kalau pesan memakai kalimat skenario */
function genText(m){
  const sp=pl(m.from);
  if(!sp.bot)return null;
  const core=m.core;
  if(m.reveal)return genReveal(sp,m.reveal);
  if(!core||core==='accuseE'){
    if(m.type==='accuse')return genAccuse(sp,m.target,m.why||null);
    if(m.type==='defend')return genDefend(sp,m.target,m.why||null);
    if(m.type==='deny'){const rt=m.replyTo;return genDeny(sp,m.back!=null?m.back:(rt&&rt.from),rt?(rt.why||(rt.type==='report'?{type:'report'}:null)):null);}
    if(m.type==='claimBend'||m.type==='claimGosip'||m.type==='report')return genClaim(sp,m);
  }
  if(core==='agree')return genAgree(sp,m.target,m.x,m.why);
  if(core==='disagree')return m.type==='accuse'?genDoubtDefense(sp,m.target,m.x,m.why):genDisagree(sp,m.target,m.x,m.why);
  if(core==='answer')return genAnswer(sp,m.target,m.why);
  if(core==='denyBack')return genDeny(sp,m.target,null);
  if(core==='clarify')return genClarify(sp,m);
  if(core==='callout')return genCallout(sp,m);
  if(m.type==='probe')return genProbe(sp,m);
  if(core==='explain')return genExplain(sp,m.target,m.why);
  if(core==='insist')return genInsist(sp,m.target,m.why);
  if(m.type==='alibi')return genAlibi(sp);
  if(['react','dunno','thanks','hurt','calm','comfort','ally','welcome','greet','salam','laugh','backdown','roleEvade','roleWarga','callRoleCmt','doubt','notMe','whatQ','ack'].includes(core))return genShort(sp,core,m.target);
  return null;
}

function textFor(m){
  const g=genText(m);if(g)return g;
  const p=pl(m.from),vars={t:m.target!=null?pl(m.target).name:'',x:m.x!=null?pl(m.x).name:'',e:m.e||''};
  let core=m.core;
  if(!core)switch(m.type){
    case 'claimBend':core=m.value?'claimBendT':'claimBendF';break;
    case 'claimGosip':core=m.value?'claimGosipT':'claimGosipF';break;
    case 'report':core=m.value?'reportT':'reportF';break;
    case 'accuse':core=m.e?'accuseE':'accuse';break;
    case 'deny':if(m.back!=null){core='denyBack';vars.t=pl(m.back).name;}else core=rnd()<.3?'swear':'deny';break;
    default:core=m.type;
  }
  return compose(p,core,vars);
}
const grudge=(a,b)=>Math.min(3,(pl(a).grudge[b]||0));
function bump(a,b,d){if(a===b)return;const p=pl(a);p.grudge[b]=(p.grudge[b]||0)+d;}

/* ---------- rencana bicara + peristiwa drama ---------- */
function planSpeakers(){
  const bots=shuffle(alive().filter(p=>!p.human));
  const ok=id=>id!=null&&pl(id).alive;
  const opening=[],info=[],talk=[],drama=[];
  // reaksi atas kabar pagi selalu di awal
  const f=G.news.find(n=>n.type==='fitnah');
  if(f){const r=bots.find(b=>['julid','kepo','sosialita'].includes(b.bot)&&b.id!==f.target)||bots.find(b=>b.id!==f.target);if(r)opening.push([{rumor:r.id,target:f.target}]);}
  for(const b of bots)(G.night.results[b.id]&&b.role!=='bandar'?info:talk).push([b.id]);
  for(const b of shuffle(bots)){
    let t=PERS[b.bot].talk;
    if(b.role==='bandar'&&b.strategy==='diam')t*=.4;
    if(b.role==='bandar'&&b.strategy==='drama')t=1;
    if(rnd()<t)talk.push([b.id]);
  }
  // musuh bebuyutan
  const [ra,rb]=G.rivals||[];
  if(ok(ra)&&ok(rb))drama.push(G.day===1?[{drama:'sindir',a:ra,b:rb,step:0},{drama:'sindir',a:ra,b:rb,step:1}]:[0,1,2,3,4,5,6].map(step=>({drama:'ldebat',a:ra,b:rb,step})));
  // besti berkhianat
  const [ba,bb]=G.besties||[];
  if(ok(ba)&&ok(bb)&&!G.betrayed&&G.day>=2){const [hi,lo]=[ba,bb].sort((x,y)=>pubSusp(y)-pubSusp(x));if(pubSusp(hi)>.4)drama.push([{drama:'khianat',a:lo,b:hi,step:0},{drama:'khianat',a:lo,b:hi,step:1}]);}
  // kejutan: dua sampai tiga per hari
  const kueSp=G.day===1&&sponsorFor('kue');
  if(kueSp){const giver=bots.find(b=>b.role!=='bandar');if(giver)drama.push([{drama:'kue',who:giver.id,brand:kueSp.brand,item:String(kueSp.slots.kue.item||'kue').slice(0,40)}]);}
  const cand=[];
  if(bots.length)cand.push([{drama:'salah',who:pickR(bots).id}],[{drama:'voice',who:pickR(bots).id}],[{drama:'cctv'}],[{drama:'paket'}]);
  const victim=bots.filter(b=>b.framed+b.accusedCount>=2).sort((a,b)=>(b.framed+b.accusedCount)-(a.framed+a.accusedCount))[0];
  if(victim)cand.push([{drama:'curhat',who:victim.id}]);
  const baper=bots.find(b=>(b.bot==='baper'||b.bot==='polos')&&b.role!=='bandar'&&b.accusedCount>=1&&!b.confessed);
  if(baper)cand.push([{drama:'pengakuan',who:baper.id}]);
  const chair=bots.find(b=>b.role==='ketua')||bots.find(b=>b.bot==='tegas'||b.bot==='bijak');
  if(chair&&bots.length>=3){
    const quiet=bots.filter(b=>b.id!==chair.id&&!(b.role==='bandar'&&b.strategy==='drama')).sort((a,b)=>PERS[a.bot].talk-PERS[b.bot].talk).slice(0,2);
    cand.push([{drama:'rapat',who:chair.id},...quiet.map(q=>({drama:'dipaksa',who:q.id}))]);
  }
  const liar=G.allMsgs.find(m=>m.type==='claimBend'&&!G.shotDone.has(m.from)&&pl(m.from).alive&&m.target!=null&&!pl(m.target).alive&&(pl(m.target).role==='bandar')!==m.value);
  const twoBend=G.bendClaimers.filter(x=>pl(x).alive).length>=2&&!G.shotDone.has('two');
  if((liar||twoBend)&&bots.length)cand.push([{drama:'shot',who:pickR(bots).id,liar:liar?liar.from:null,quote:liar?liar.text:null}]);
  drama.push(...shuffle(cand).slice(0,2+(rnd()<.5?1:0)));
  // satu ibu menanyai pemain langsung: alibi, alasan menuduh/membela, atau pendapat kalau dari tadi diam
  const meP=human();
  if(meP&&meP.alive&&G.mode==='bot'&&G.flags&&G.flags.probe&&bots.length){const asker=bots.find(b=>['kepo','julid','tegas','sosialita'].includes(b.bot))||bots[0];drama.push([{probe:asker.id}]);}
  // urutan: kabar pagi, yang punya info, lalu obrolan dan drama berselang-seling; setiap blok utuh
  const rest=shuffle(talk);
  for(const d of drama)rest.splice(Math.min(rest.length,1+ri(Math.max(1,rest.length))),0,d);
  return [...opening,...info,...rest].flat();
}
function accusedToday(id){return G.msgs.filter(m=>m.target===id&&(m.type==='accuse'||(m.type==='claimBend'&&m.value)||(m.type==='claimGosip'&&m.value)||(m.type==='report'&&m.value)));}
function botSpeak(slot){
  const m=botSpeakRaw(slot);
  if(!m)return null;
  if(m.sys)return m;
  const dup=!m.replyTo&&G.msgs.some(x=>x.from===m.from&&x.type===m.type&&x.target===m.target&&x.value===m.value&&!x.core&&!m.core);
  if(dup)return m.type==='flavor'?null:{from:m.from,type:'flavor'};
  return m;
}
function pickAccuseTarget(p){
  let best=null,bs=-1;
  for(const q of alive()){if(q.id===p.id)continue;const s=prob(p,q.id)+.1*grudge(p.id,q.id);if(s>bs){bs=s;best=q;}}
  return best?{q:best,s:bs}:null;
}
function botSpeakRaw(slot){
  if(typeof slot==='object'){
    if(slot.rumor!=null){const p=pl(slot.rumor);if(!p.alive)return null;return{from:p.id,type:'rumor',target:slot.target};}
    if(slot.reply!=null){const r=botReply(pl(slot.reply),slot.hm);if(r)r.replyTo=slot.hm;return r;}
    if(slot.respond!=null)return botRespond(pl(slot.respond),slot.to);
    if(slot.counter!=null){const r=botCounter(pl(slot.counter),slot.to);return r;}
    if(slot.probe!=null)return probeSpeak(pl(slot.probe));
    if(slot.drama)return dramaSpeak(slot);
    return null;
  }
  const p=pl(slot);if(!p.alive)return null;
  const per=PERS[p.bot];
  const accused=accusedToday(p.id).filter(m=>!m.answered);
  if(p.role==='bandar')return bandarSpeak(p,accused,per);
  if(accused.length&&!p.denied){
    p.denied=true;accused.forEach(m=>m.answered=true);
    const hard=accused.find(m=>m.type==='claimBend');
    if(hard&&p.role==='bendahara'&&p.audited&&p.audited.length){const t=p.audited[p.audited.length-1];return{from:p.id,type:'claimBend',target:t,value:isBandar(t)};}
    const back=accused[0].from;
    const rv=pressuredReveal(p,{from:p.id,replyTo:accused[accused.length-1]});if(rv)return rv;
    return{from:p.id,type:'deny',back:rnd()<.35+.15*grudge(p.id,back)?back:null,replyTo:accused[accused.length-1]};
  }
  const bestie=G.besties&&G.besties.includes(p.id)&&!G.betrayed?G.besties.find(x=>x!==p.id):null;
  if(bestie!=null&&pl(bestie).alive&&accusedToday(bestie).length&&!p.defendedBestie){p.defendedBestie=G.day;return{from:p.id,type:'defend',target:bestie,core:'bestieDefend'};}
  const r=G.night.results[p.id];
  if(r&&!p.saidInfo){
    p.saidInfo=true;
    if(r.target!=null&&!pl(r.target).alive){}
    else if(r.type==='audit'&&(r.value||rnd()<TUNE.auditClaimClean))return{from:p.id,type:'claimBend',target:r.target,value:r.value};
    else if(r.type==='gosip'&&rnd()<.6)return{from:p.id,type:'claimGosip',target:r.target,value:r.value};
    else if(r.type==='intip'&&rnd()<.6)return{from:p.id,type:'report',target:r.target,value:r.value};
    else if(r.type==='jaga'&&r.value)return{from:p.id,type:'ketua',target:r.target};
    else if(r.type==='ngerumpi')return{from:p.id,type:'ngerumpi'};
  }
  const top=pickAccuseTarget(p);
  if(top&&top.s>.42&&rnd()<.85)return{from:p.id,type:'accuse',target:top.q.id,why:bestReason(p,top.q.id,true)};
  const low=lowSuspect(p);
  if(low&&rnd()<.3)return{from:p.id,type:'defend',target:low.id,why:bestReason(p,low.id,false)};
  return{from:p.id,type:'flavor'};
}
/* Pertanyaan bot ke pemain, menyesuaikan apa yang sudah pemain lakukan hari ini */
function probeSpeak(p){
  const me=human();if(!p.alive||!me||!me.alive)return null;
  const mine=G.msgs.filter(m=>m.from===me.id);
  const lastAcc=[...mine].reverse().find(m=>m.type==='accuse'&&m.target!=null&&pl(m.target).alive&&m.target!==p.id);
  const lastDef=[...mine].reverse().find(m=>m.type==='defend'&&m.target!=null&&pl(m.target).alive&&m.target!==p.id);
  let kind='alibi',x=null;
  if(!mine.length)kind=rnd()<.5?'quiet':'alibi';
  else if(lastDef&&prob(p,lastDef.target)>.4){kind='whyDefend';x=lastDef.target;}
  else if(lastAcc&&prob(p,lastAcc.target)<.4){kind='whyAccuse';x=lastAcc.target;}
  else if(G.hAlibi[G.day])kind='quiet';
  return{from:p.id,type:'probe',target:me.id,kind,x};
}
function genProbe(sp,m){
  const M=addr(sp,human()),X=m.x!=null?addr(sp,pl(m.x)):'';
  const L={alibi:[`${M}, semalam ngapain aja?`,`${M} dari tadi belum cerita, semalam ke mana?`,`Eh ${M}, semalam di rumah aja?`],

    whyAccuse:[`${M}, kenapa yakin banget sama ${X}?`,`${M}, buktinya apa soal ${X}?`],
    whyDefend:[`${M}, kok belain ${X} terus sih?`,`Kenapa ${M} percaya banget sama ${X}?`]};
  return finish(sp,pickR(L[m.kind]||L.alibi),'neutral');
}
/* Ucapan pemain yang bertentangan: alibi yang berubah, alibi yang dibantah laporan intip, sikap yang berbalik */
const H_ACTS=[[/\b(di rumah|dirumah|gak ke mana mana|gak kemana mana)\b/,'di rumah','home'],[/\b(tidur|ketiduran)\b/,'tidur','home'],[/\bnonton\b/,'nonton','home'],[/\bmasak\b/,'masak','home'],
  [/\b(nemenin|jagain|ngurus|ngelonin) anak\b/,'jagain anak','home'],[/\b(nyetrika|beres beres|istirahat|main hp|telponan|rebahan)\b/,'di rumah','home'],
  [/\b(ke warung|beli gas|belanja)\b/,'ke warung','out'],[/\b(ke apotek|beli obat|ke bidan|ke klinik)\b/,'ke apotek','out'],[/\b(ronda|jaga pos)\b/,'ronda','out'],
  [/\b(kerja|lembur|kantor|shift)\b/,'kerja','out'],[/\b(ngaji|pengajian|tahlilan|masjid|musholla)\b/,'ngaji','out'],[/\b(jemput|nganter|antar)\b/,'jemput keluarga','out'],[/\b(keluar|pergi)\b/,'keluar','out']];
function alibiOf(s){for(const [re,text,cls] of H_ACTS)if(re.test(s)&&!(cls==='out'&&/\bgak (keluar|pergi|ke mana)\b/.test(s)))return{text,cls};return null;}
function genCallout(sp,m){

      if(p.role==='bandar'&&hm.type==='claimBend'&&rnd()<.6)return{from:p.id,type:'claimBend',target:me.id,value:true};
      return{from:p.id,type:'deny',back:rnd()<.45+.15*grudge(p.id,me.id)?me.id:null};
    }
    if(hm.type==='defend'||(['claimBend','report','claimGosip'].includes(hm.type)&&hm.value===false))return{from:p.id,type:'react',core:'thanks',target:me.id};
    if(hm.type==='angry'){p.mood++;bump(p.id,me.id,1);return{from:p.id,type:'react',core:'hurt'};}
    if(hm.type==='deny'||hm.type==='swear')return{from:p.id,type:'react',core:'doubt'};
    return{from:p.id,type:'react',core:'whatQ',target:me.id};
  }
  if(hm.type==='question')return opinionOf(p);
  if(hm.type==='deny'||hm.type==='swear')return p.role!=='bandar'&&prob(p,me.id)<.45?{from:p.id,type:'react',core:'comfort',target:me.id}:{from:p.id,type:'react',core:'doubt'};
  if(hm.target!=null&&hostile)return verdictOn(p,hm.target,me);
  if((hm.type==='defend'||(['claimBend','report','claimGosip'].includes(hm.type)&&hm.value===false))&&hm.target!=null){
    const agree=p.role==='bandar'?isBandar(hm.target)||rnd()<.5:prob(p,hm.target)<.4;
    return agree?{from:p.id,type:'defend',target:hm.target,core:'react'}:{from:p.id,type:'accuse',target:hm.target,core:'disagree',x:me.id,why:bestReason(p,hm.target,true)};
  }
  if(hm.type==='angry')return{from:p.id,type:'react',core:p.bot==='bijak'||p.bot==='tegas'?'calm':'hurt'};
  if(hm.type==='cry')return{from:p.id,type:'react',core:'comfort',target:me.id};
  return{from:p.id,type:'react'};
}

/* Konteks obrolan hari ini: siapa yang terakhir bicara, siapa yang menuduhku, sikap terakhir soal orang lain */
function chatContext(){

  const bots=G.msgs.filter(m=>m.from!=null&&m.from!==me.id&&pl(m.from).alive&&!pl(m.from).human).slice(-8).reverse();
  const last=bots[0]||null;
  const atMe=bots.find(m=>m.target===me.id&&hostile(m))||null;
  const stance=bots.slice(0,4).find(m=>m.target!=null&&m.target!==me.id&&pl(m.target).alive&&(hostile(m)||m.type==='defend'||((m.type==='claimBend'||m.type==='report'||m.type==='claimGosip')&&m.value===false)))||null;
  const claim=bots.find(m=>m.target!=null&&hostile(m))||null;
  const toMe=bots.slice(0,4).find(m=>m.target===me.id||(m.replyTo&&m.replyTo.from===me.id))||null;
  const stanceOf=m=>!m?null:hostile(m)?'accuse':'defend';
  // pesan pemain sendiri yang terakhir hari ini (untuk "dia", "Bu X juga", "kalau Bu Y?", "soalnya …")
  const all=G.msgs.filter(m=>m.from!=null).slice(-10).reverse();

  const mineDir=!mine?null:mine.type==='accuse'||((mine.type==='claimBend'||mine.type==='report'||mine.type==='claimGosip')&&mine.value)?'accuse':mine.type==='defend'||mine.value===false?'defend':null;
  // orang ketiga yang paling baru dibicarakan, oleh siapa pun (termasuk pemain)
  const recent=all.find(m=>m.target!=null&&m.target!==me.id&&pl(m.target).alive);
  const third=recent?recent.target:stance?stance.target:(last&&last.target!=null&&last.target!==me.id?last.target:null);
  return{last,atMe,claim,stance,stanceDir:stanceOf(stance),you:(toMe||atMe||last||{}).from??null,third,mine,mineDir};
}

    const relObj=new Set();for(let j=0;j<w.length;j++)if(w[j-1]==='yang'&&(SEMX.trick.test(w[j])||SEMX.steal.test(w[j])||SEMX.badAct.test(w[j]))){for(let q=j+1;q<Math.min(w.length,j+4);q++)if(w[q][0]==='@'){relObj.add(q);break;}}
    const leftSubj=k=>{for(let j=k-1;j>=0;j--){if(relObj.has(j))return null;const e=ent(j);if(e&&(e.k==='p'||e.k==='self'||e.k==='group')){let q=j-1;while(q>=0&&/^(lah|sih|deh|dong|kok|ya)$/.test(w[q]))q--;return{...e,j,neg:SEMX.neg.test(w[q]||'')};}if(isPred(w[j]))return null;}return null;};
    const rightObjs=k=>{const o=rightObj(k);if(!o||o.k!=='p')return o?[o]:[];const list=[o];let j=o.j+1;while(j+1<w.length&&/^(sama|dan|dengan|atau|,)$/.test(w[j])&&w[j+1][0]==='@'){list.push({k:'p',id:+w[j+1].slice(1),j:j+1});j+=2;}return list;};
    const rightObj=k=>{for(let j=k+1;j<=Math.min(w.length-1,k+5);j++){const e=ent(j);if(e)return{...e,j};if(!SEMX.skip.test(w[j])&&!SEMX.neg.test(w[j])&&!SEMX.hedge.test(w[j]))return null;}return null;};
    // subjek kalimat terbalik: "bukan @1 yang P" atau "yang P bukan @1"

    let used=false;

        continue;

      }

    }

/* Nama yang disebut (dengan posisi). Salah ketik satu huruf diterima kalau didahului "bu"/"jeng". */
function findMentions(words){
  const me=human(),ments=[],others=alive().filter(p=>p.id!==me.id);
  words.forEach((w,i)=>{
    if(w.length<3)return;
    const hon=i>0&&/^(bu|jeng|si|mbak|bunda|tante)$/.test(words[i-1]);
    for(const p of others){
      const ok=nameKeys(p).some(k=>w===k||(k.length>=5&&w.length>=4&&k.startsWith(w.slice(0,4))&&w.startsWith(k.slice(0,4)))||(hon&&k.length>=4&&lev1(w,k)));
      if(ok){if(!ments.some(m=>m.id===p.id&&Math.abs(m.i-i)<=2))ments.push({id:p.id,i});break;}
    }
  });
  return ments;
}
/* Teks yang sudah dirapikan dan disamarkan untuk catatan belajar: nama jadi <p3>, namamu jadi <me>, angka panjang dibuang */
function anonNorm(text){
  const words=normText(text).trim().split(' '),ments=findMentions(words),me=human();

    .filter((w,i,a)=>!(w==='bu'&&/^<(p\d+|me)>$/.test(a[i+1]||''))).join(' ').slice(0,200);

/* Rujukan dengan deskripsi diganti nama orangnya, supaya lapisan berikutnya membacanya seperti nama biasa. */
function resolveRefs(s,ctx,me){

  const audited=()=>{const m=last(x=>x.type==='claimBend'&&x.target!=null&&alive2(x.target));return m?m.target:null;};
  const reporter=()=>{const m=last(x=>x.type==='report'&&alive2(x.from));return m?m.from:null;};
  const reported=()=>{const m=last(x=>x.type==='report'&&x.value&&alive2(x.target));return m?m.target:null;};
  const rumored=()=>{const n=(G.news||[]).find(x=>x.type==='fitnah'&&alive2(x.target));if(n)return n.target;const m=last(x=>x.type==='rumor'&&alive2(x.target));return m?m.target:null;};
  const accused=()=>{const m=last(x=>x.from!==me.id&&x.target!=null&&alive2(x.target)&&(x.type==='accuse'||((x.type==='claimBend'||x.type==='report')&&x.value)));return m?m.target:null;};

  const newsT=type=>{const n=[...(G.newsLog||[])].reverse().find(x=>x.type===type&&alive2(x.target));return n?n.target:null;};

    [/\b(yang|orang yang) (dilihat|diliat|diintip|ketahuan|kelihatan|keliatan) keluar( rumah)?( tadi| semalam| itu)?\b/g,reported],
    [/\b(yang|orang yang) (diaudit|dituduh bendahara|dibilang bandar sama bendahara)( tadi| itu)?\b/g,audited],
    [/\b(yang|orang yang) (digosipin|digosipkan|difitnah|kena fitnah|kena gosip|dikabarin|dikabarkan|jadi bahan gosip)( tadi pagi| tadi| pagi ini| pagi tadi| itu)?\b/g,rumored],
    [/\b(yang|orang yang)( dari tadi| barusan| tadi)? (nuduh|nuduhin|fitnah|nyerang|nyalahin|mojokin|nyudutin) aku( tadi| itu| terus| mulu)?\b/g,()=>ctx.atMe?ctx.atMe.from:null],
    [/\b(yang|orang yang) (dituduh|dicurigai)( tadi| barusan| itu)?\b/g,accused],
    [/\b(yang|orang yang) (barusan|tadi) (ngomong|bilang|bicara|nulis)\b|\b(sama|dengan) yang (tadi|barusan)\b(?! \S+ (nuduh|bilang))/g,()=>ctx.last?ctx.last.from:null],
    [/\b(yang|orang yang)( dari tadi)? (diem|diam|gak ngomong|gak bersuara)( aja| terus| mulu| dari tadi)?\b/g,quiet],
  ];

  return s.replace(/\s+/g,' ');
}

    if(reportT===bottom.id&&reportV===false)return res('report',{target:bottom.id,value:false,extra});
    return res('defend',{target:bottom.id,extra,conf:bottom.v<=-1?.85:.55,ovr:bottom.v>-1&&!ctxUsed});
  }
  if(has_cry)return res('cry');
  if(has(/\b(dasar|tega|munafik|sialan|bodoh|bego|goblok|norak|nyebelin)\b/))return res('angry',{target:ments[0]?ments[0].id:null});
  if(has(W_ACCUSE)&&has(/\bdia\b/)&&ctx.third!=null&&!ments.length)return res('accuse',{target:ctx.third});
  // alasan susulan yang isinya belum dikenal tetap melanjutkan sikap pemain terhadap orang yang sama
  if(reasonCont)return res(ctx.mineDir,{target:mine.target,conf:.7});
  // aturan tidak menangkap maksudnya: tanya model kata hasil belajar dari pemain lain
  const learned=nbRes(BRAIN&&BRAIN.nb?BRAIN.nb.min:1);if(learned)return learned;
  if(ments.length)return res('mention',{target:ments[0].id});
  return res('chat');
}

/* Dampak setiap pesan pada keyakinan bot */
function applyMsg(m){
  const from=pl(m.from);
  if((m.type==='claimBend'||m.type==='claimRole')&&!G.bendClaimers.includes(m.from))G.bendClaimers.push(m.from);
  const hostile=m.type==='accuse'||((m.type==='claimBend'||m.type==='claimGosip'||m.type==='report')&&m.value);
  if(m.target!=null&&hostile){bump(m.target,m.from,1);pl(m.target).mood++;pl(m.target).accusedCount++;}
  if(m.target!=null&&(m.type==='defend'||(m.type==='claimBend'&&m.value===false)))bump(m.target,m.from,-1);
  for(const v of alive()){
    if(v.id===m.from||v.human||v.role==='bandar')continue;
    const c=cred(v,m.from),t=m.target;
    switch(m.type){
      case 'claimBend':{
        const lie=(v.role==='bendahara')||(t===v.id&&m.value)||(v.audited&&v.audited.includes(t)&&isBandar(t)!==m.value);
        if(lie){mulBelief(v,m.from,8);break;}
        const others=G.bendClaimers.filter(x=>x!==m.from&&pl(x).alive);
        if(others.length){mulBelief(v,m.from,1.8);others.forEach(x=>mulBelief(v,x,1.4));}
        mulBelief(v,t,lrf(lrOf(m.value?'bendT':'bendF'),c));
        break;}
      case 'claimGosip':if(t===v.id&&m.value){mulBelief(v,m.from,2);break;}mulBelief(v,t,lrf(lrOf(m.value?'gosipT':'gosipF'),c));break;
      case 'report':
        if(t===v.id){if(wentOut(v)!==m.value)mulBelief(v,m.from,5);break;}
        mulBelief(v,t,lrf(lrOf(m.value?'reportOut':'reportIn'),c));break;
      case 'accuse':if(t===v.id){mulBelief(v,m.from,1.6);break;}mulBelief(v,t,lrf(lrOf(from.human?'humanAccuse':'accuse'),c));
        if(m.why&&VERIFIABLE[m.why.kind]&&m.why.target===t)mulBelief(v,t,VERIFIABLE[m.why.kind]);break;
      case 'defend':if(v.audited&&v.audited.includes(t)&&isBandar(t)){mulBelief(v,m.from,3);break;}mulBelief(v,t,lrf(lrOf(from.human?'humanDefend':'defend'),c));break;
      case 'ketua':mulBelief(v,t,.7);mulBelief(v,m.from,.8);break;
      case 'deny':case 'swear':mulBelief(v,m.from,.93);break;
      case 'salah':mulBelief(v,m.from,m.sus?TUNE.salahLR:.9);break;
      case 'shot':if(t!=null)mulBelief(v,t,TUNE.shotLR);break;
      case 'cry':case 'pengakuan':mulBelief(v,m.from,.9);break;
    }
  }
  G.msgs.push(m);G.allMsgs.push({...m,day:G.day});
}

/* ---------- voting ---------- */
function botVote(p,pool){
  const cands=(pool||alive()).filter(q=>q.id!==p.id);
  if(!cands.length)return null;
  if(p.role==='bandar'){
    const partner=cands.find(q=>q.role==='bandar');
    if(partner&&pubSusp(partner.id)>.75&&rnd()<.3)return partner.id;
    const inn=cands.filter(q=>q.role!=='bandar');
    return (inn.length?inn:cands).map(q=>({q,s:pubSusp(q.id)+rnd()*.12})).sort((a,b)=>b.s-a.s)[0].q.id;
  }
  const noise=PERS[p.bot].noise;
  return cands.map(q=>({q,s:prob(p,q.id)+TUNE.bandwagon*pubSusp(q.id)+TUNE.grudgeVote*grudge(p.id,q.id)+(rnd()-.5)*2*noise})).sort((a,b)=>b.s-a.s)[0].q.id;
}
function tally(votes){
  const count={};for(const [,t] of votes)count[t]=(count[t]||0)+1;
  let max=0,top=[];for(const [t,c] of Object.entries(count)){if(c>max){max=c;top=[+t];}else if(c===max)top.push(+t);}
  const need=TUNE.majority?Math.floor(alive().length/2)+1:1;
  return{count,kicked:top.length===1&&max>=need?top[0]:null,need,top,max};
}
function applyKick(kid,votes){
  const k=pl(kid);k.alive=false;k.kickedDay=G.day;G.kicked.push(kid);
  const bandar=k.role==='bandar';
  for(const v of alive()){
    if(v.human||v.role==='bandar')continue;
    v.beliefs[kid]=bandar?1e4:1e-4;
    for(const m of G.allMsgs){
      if(m.target!==kid||m.from===v.id||!pl(m.from).alive)continue;
      if(m.type==='claimBend')mulBelief(v,m.from,m.value===bandar?.3:8);
      if(m.type==='accuse'&&!bandar)mulBelief(v,m.from,1.3);
      if(m.type==='defend'&&bandar)mulBelief(v,m.from,1.8);
    }
    for(const [voter,t] of votes)if(t===kid&&voter!==v.id&&pl(voter).alive)mulBelief(v,voter,bandar?.85:1.15);
  }
}
function checkWin(afterVote){
  const b=alive().filter(p=>p.role==='bandar').length,w=alive().length-b;
  if(b===0){G.winner='warga';G.reason='Semua Bandar Bodong ketahuan. Kas arisan selamat!';return true;}
  if(b>=w){G.winner='bandar';G.reason='Bandar Bodong menguasai grup. Kas dibawa kabur!';return true;}
  if(afterVote&&G.day>=TUNE.maxDay){G.winner='bandar';G.reason=`Pertemuan ke-${TUNE.maxDay} lewat. Bandar Bodong kabur bawa sisa kas ${jt(G.kas)}!`;return true;}
  return false;
}

/* ---------- simulasi semua-bot (uji keseimbangan) ---------- */
function simulate(games,n){
  let warga=0,days=0;
  for(let g=0;g<games;g++){
    newGame({mode:'sim',n:n||6});
    while(!G.winner){
      G.night.actions={};for(const p of alive())G.night.actions[p.id]=botNightAction(p);
      resolveNight();
      const q=planSpeakers();for(let i=0;i<q.length;i++){const m=botSpeak(q[i]);if(!m)continue;if(m.sys){if(m.apply)m.apply();continue;}applyMsg(m);q.splice(i+1,0,...followUps(m));}
      const votes=alive().map(p=>[p.id,botVote(p)]);const t=tally(votes);
      if(t.kicked!=null)applyKick(t.kicked,votes);
      if(!checkWin(true))G.day++;
    }
    if(G.winner==='warga')warga++;days+=G.day;
  }
  R=Math.random;
  return{wargaWin:warga/games,avgDays:days/games};
}
function strategyStats(games,n){const out={};for(const st of BANDAR_STRATEGIES){G0force=st;const r=simulate(games,n);out[st]=+(1-r.wargaWin).toFixed(3);}G0force=null;return out;}
window.ArisanSim={simulate,strategyStats,TUNE,debug:{BOTS,avatarSVG,get COLOR_NAME(){return COLOR_NAME;},get SANDAL(){return SANDAL;},semDebug,get G(){return G;},get chat(){return chat;},setBrain(j){BRAIN=validBrain(j);applyBrain();return BRAIN;},anonNorm,nbGuess,recordGame,newGame,followUps,deductions,genText,parseHuman,compose,textFor,evidence,prob,pubSusp,alive,botNightAction,resolveNight,planSpeakers,botSpeak,applyMsg,botVote,tally}};

function resultTone(r){
  if(r.type==='audit'||r.type==='gosip'||r.type==='intip')return r.value?'bad':'good';

}
function resultText(r){
  const t='<b>'+esc(pl(r.target).name)+'</b>',acc=Math.round(TUNE.gosipAcc*100),seen=Math.round(TUNE.intipSeen*100);
  switch(r.type){
    case 'audit':return r.value?`Hasil audit: ${t} adalah BANDAR BODONG!`:`Hasil audit: ${t} bersih.`;
    case 'gosip':return r.value?`Kabar yang kamu dengar: ${t} mencurigakan. (Kabarmu benar ${acc}% dari waktu.)`:`Kabar yang kamu dengar: ${t} biasa-biasa saja. (Kabarmu benar ${acc}% dari waktu.)`;
    case 'intip':return r.value?`${t} keluar rumah semalam.`:`${t} tidak terlihat keluar. Kemungkinan bukan bandar, tapi malam gelap: orang yang keluar hanya terlihat ${seen}% dari waktu.`;
    case 'jaga':return r.value?`Tepat! Bandar mengajak ${t} ngerumpi, dan kamu menolaknya. Fitnahnya sudah kamu klarifikasi.`:`Kamu menjaga ${t}. Malam ini tidak ada yang mengganggunya.`;
    case 'fitnah':return r.value?`${t} kamu ajak ngerumpi sampai subuh. Aksinya malam ini gagal, dan fitnahnya menyebar.`:`Bu RT menjaga ${t}. Ajakanmu ditolak dan fitnahnya diklarifikasi.`;

/* Sidang: obrolan sisa dihentikan, dua tersangka teratas membela diri, lalu seorang saksi membongkar */
function setStage(state){
  const b=document.getElementById('stageBtn');if(!b)return;
  b.classList.toggle('ready',state==='quiet'||state==='vote');
  b.textContent={quiet:'⚖️ Obrolan mulai sepi · Lanjut ke sidang',chat:'⚖️ Lanjut ke sidang',sidang:'Sidang berlangsung… lewati ke voting',vote:'🗳️ Voting sekarang'}[state];
  if(state==='quiet')coach('sidang','Kalau sudah cukup ngobrol, lanjut ke <b>sidang</b>. Setelah itu kalian voting.');
}
function startSidang(){
  if(screen!=='day'||chat.sidang)return;
  chat.sidang=true;const tok=++G.token;
  chat.queue=chat.queue.slice(0,chat.idx);
  const sus=alive().slice().sort((a,b)=>pubSusp(b.id)-pubSusp(a.id)).slice(0,2);
  const witness=shuffle(alive().filter(p=>!p.human&&!sus.includes(p)))[0];
  let target=sus[0]?sus[0].id:null;
  if(witness){
    if(witness.role==='bandar'){const inn=sus.find(x=>x.role!=='bandar');if(inn)target=inn.id;}
    else{const t=sus.slice().sort((a,b)=>prob(witness,b.id)-prob(witness,a.id))[0];if(t)target=t.id;}
  }
  chat.queue.push({sidang:'open',drama:'s'},...sus.map(x=>({sidang:'bela',who:x.id,drama:'s'})));
  if(witness&&target!=null)chat.queue.push({sidang:'saksi',who:witness.id,target,drama:'s'});
  chat.queue.push({sidang:'close',drama:'s'});
  chat.sidangDone=true;chat.done=false;
  setStage('sidang');
  sfx.jeng();
  setTimeout(()=>tick(tok),500);
}

const HEAT=[[0,'Adem 😌'],[4,'Mulai panas 🌶️'],[8,'Panas 🔥'],[13,'Membara 🔥🔥']];

function msgHTML(m,id){

/* Kecepatan obrolan: lama mengetik mengikuti panjang pesan, ditambah jeda antar-pesan untuk berpikir */
/* Tempo mengikuti riset waktu baca: rata-rata 155–238 kata per menit (studi Indonesia; Brysbaert 2019).
   read = pengali waktu baca 155 kata/menit yang dijamin sebelum pesan berikutnya muncul (Cepat sengaja untuk membaca sekilas).
   key  = tambahan waktu setelah pesan penting (klaim, laporan, bukti, kabar) supaya pemain sempat menghubungkan petunjuk. */
const SPEEDS={
  santai:{label:'Santai',base:1600,perChar:40,maxType:6000,gapMin:2200,gapMax:4200,read:1.3,key:2000},
  normal:{label:'Normal',base:900,perChar:22,maxType:3500,gapMin:900,gapMax:1800,read:1,key:1500},
  cepat: {label:'Cepat', base:400,perChar:8, maxType:1500,gapMin:300,gapMax:700,read:0,key:500}
};
const READ_WPM=155;
const readMs=text=>String(text||'').replace(/<[^>]+>/g,' ').trim().split(/\s+/).filter(Boolean).length/READ_WPM*60000;
const isKeyMsg=m=>['claimBend','claimGosip','report','ketua','shot','salah'].includes(m.type)||!!m.why||/^(bongkar|counterBend|explain)/.test(m.core||'');
/* Jeda sebelum pesan berikutnya: acak seperti manusia, tapi tidak pernah lebih cepat dari waktu membaca pesan ini */
// pemain tetap membaca selama indikator "sedang mengetik" pesan berikutnya tampil, jadi waktu dasar mengetik ikut dihitung
const paceAfter=(text,key)=>{const sp=SPEEDS[chatSpeed];return Math.max(gapTime(),readMs(text)*sp.read-sp.base)+(key?sp.key:0);};
let chatSpeed=SPEEDS[store.get('chatSpeed','santai')]?store.get('chatSpeed','santai'):'santai';
const typingTime=text=>{const sp=SPEEDS[chatSpeed];return Math.min(sp.maxType,sp.base+sp.perChar*String(text||'').length);};
const gapTime=()=>{const sp=SPEEDS[chatSpeed];return sp.gapMin+rnd()*(sp.gapMax-sp.gapMin);};
/* Pemain sedang menyusun pesan: kotak ketik masih berisi tulisan, atau baru saja diketik.
   Fokus saja tidak cukup, karena setelah Kirim keyboard HP biasanya tetap terbuka. */
let lastKeyAt=0;
function playerBusy(){const i=document.getElementById('msgIn');if(!i||i.disabled)return false;return i.value.trim().length>0||(document.activeElement===i&&Date.now()-lastKeyAt<4000);}
const later=(tok,ms,fn)=>setTimeout(()=>{if(G&&G.token===tok&&screen==='day')fn();},chat.fast?Math.min(ms,300):ms);
function tick(tok){
  if(!G||G.token!==tok||screen!=='day')return;
  if(chat.idx>=chat.queue.length){
    if(!chat.done){chat.done=true;setStage(chat.sidangDone?'vote':'quiet');}
    return;
  }
  // tunggu dulu kalau pemain sedang mengetik, kecuali sedang dipercepat
  const hold=document.getElementById('holdNote');
  const awaiting=chat.awaitAnswer&&Date.now()-chat.awaitAnswer.at<15000;
  if(!chat.fast&&(playerBusy()||(chat.waitDefense&&Date.now()-chat.waitDefense<12000)||awaiting)){if(hold){hold.textContent=awaiting?'Ibu-ibu menunggu jawabanmu…':'Ibu-ibu menunggu kamu selesai mengetik…';hold.hidden=false;}setTimeout(()=>tick(tok),700);return;}
  if(hold)hold.hidden=true;
  const slot=chat.queue[chat.idx++];
  const m=botSpeak(slot);
  if(!m){tick(tok);return;}
  if(m.sys){
    later(tok,1200,()=>{if(m.apply)m.apply();addToFeed(m.html);chat.lastBotAt=Date.now();addHeat({type:m.heatType});sfx.jeng();later(tok,paceAfter(m.html,true)+800,()=>tick(tok));});
    return;
  }
  const who=pl(m.from);
  m.text=m.text||textFor(m);
  addToFeed(`<div class="typing">${esc(who.name)} sedang mengetik…</div>`);
  const extra=chat.firstExtra||0;chat.firstExtra=0;
  later(tok,typingTime(m.text)+extra,()=>{
    if(!who.alive){tick(tok);return;}
    applyMsg(m);addHeat(m);
    if(m.type==='probe')chat.awaitAnswer={from:m.from,kind:m.kind,x:m.x,at:Date.now()};
    chat.queue.splice(chat.idx,0,...followUps(m));
    const mid='m'+(G.msgCounter=(G.msgCounter||0)+1);
    addToFeed(msgHTML(m,mid));sfx.pop();
    const rk=m.khianat?'khianat':m.type==='claimBend'&&!m.value?null:m.type;
    if(rk&&REACTS[rk]&&rnd()<.75)later(tok,900+rnd()*1400,()=>addReacts(mid,rk));
    chat.lastBotAt=Date.now();
    let next=paceAfter(m.text,isKeyMsg(m));
    if(m.type==='salah'&&!m.voice){
      // pesan salah kirim dihapus lagi, tapi sudah sempat terbaca
      later(tok,2600,()=>{const el=document.querySelector('#'+mid+' .txt');if(el){el.textContent='🚫 Pesan ini telah dihapus';el.parentElement.classList.add('deleted');}
        addToFeed(`<div class="sys">${esc(who.name)}: "Eh maaf salah grup 🙈"</div>`);});
      next+=1200;
    }
    // dituduh bertubi-tubi: ngambek keluar grup sebentar
    const t=m.target!=null?pl(m.target):null;
    if(t&&!t.human&&t.alive&&!t.ngambek&&accusedToday(t.id).length>=3&&rnd()<.7){
      t.ngambek=true;
      later(tok,900,()=>{addToFeed(`<div class="sys drama">😤 ${esc(t.name)} keluar dari grup.</div>`);addHeat({type:'ngambek'});sfx.gasp();
        later(tok,1600,()=>{addToFeed(`<div class="sys">Bu RT menambahkan ${esc(t.name)} kembali ke grup.</div>`);
          later(tok,900,()=>{const back={from:t.id,type:'react',text:pickR(['Aku balik cuma demi kas ya. Bukan demi kalian.','Hmph. Ya sudah, aku di sini. Tapi aku kecewa.','Oke aku balik. Tapi tolong, jangan tuduh aku sembarangan lagi.'])};addToFeed(msgHTML(back));});});});
      next+=3600;
    }
    later(tok,next,()=>tick(tok));
  });
}

function bindComposer(){
  const acts=document.getElementById('acts');if(!acts)return;
  const input=document.getElementById('msgIn'),tg=document.getElementById('tgts');
  const stickers=P.owned.filter(o=>o.startsWith('sticker:')).map(o=>cos('sticker',o.split(':')[1]));
  acts.onclick=e=>{
    const sb=e.target.closest('[data-sticker]');if(sb){input.value=stickers[+sb.dataset.sticker].text;tg.hidden=true;input.focus();return;}
    const b=e.target.closest('[data-act]');if(!b)return;
    const q=QUICK.find(x=>x.id===b.dataset.act);
    if(q.sheet){
      openSheet(`<h3>Ngaku apa?</h3>${CLAIMS.map(c=>`<button data-claim="${c.id}">${c.label}</button>`).join('')}<button class="ghost" data-claim="">Batal</button>`,cb=>{
        const c=CLAIMS.find(x=>x.id===cb.dataset.claim);closeSheet();if(!c)return;
        chat.act=c;acts.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));tg.hidden=false;
      });
      return;
    }
    chat.act=q;
    acts.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(q.noT){input.value=q.tpl;tg.hidden=true;input.focus();}else tg.hidden=false;
  };
  tg.onclick=e=>{const b=e.target.closest('[data-t]');if(!b||!chat.act)return;input.value=chat.act.tpl.replace('{t}',pl(+b.dataset.t).name);tg.hidden=true;acts.querySelectorAll('button').forEach(x=>x.classList.remove('on'));input.focus();};
