name = "arisan-brain"
main = "src/index.js"
compatibility_date = "2025-09-01"
# hanya lewat api.gamewarga.com; alamat workers.dev dan URL pratinjau dimatikan
workers_dev = false
preview_urls = false
routes = [{ pattern = "api.gamewarga.com", custom_domain = true }]

# Setiap jam: guru otomatis memberi label pesan yang membuat aturan ragu. Jam 03.00 WIB juga membersihkan data lama.
[triggers]
crons = ["0 * * * *"]

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "arisan"
database_id = "d74206b4-d03c-4b94-acc5-df9e18a9c3dd"
